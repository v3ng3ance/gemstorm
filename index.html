<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proiectele mele</title>
<style>
  :root { --bg:#0e1017; --card:#181b26; --card2:#20243a; --txt:#e8eaf2; --mut:#8a90a8; --acc:#7c5cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:radial-gradient(circle at 20% 0%,#1c1840 0%,var(--bg) 55%); color:var(--txt); min-height:100vh; padding:40px 20px 60px; }
  header { max-width:1100px; margin:0 auto 32px; }
  h1 { font-size:2.2rem; letter-spacing:-.5px; }
  h1 span { color:var(--acc); }
  header p { color:var(--mut); margin-top:6px; }
  input { margin-top:20px; width:100%; max-width:380px; padding:12px 16px; border-radius:12px; border:1px solid #2c3150; background:var(--card); color:var(--txt); font-size:1rem; outline:none; }
  input:focus { border-color:var(--acc); }
  section { max-width:1100px; margin:0 auto 34px; }
  h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:2px; color:var(--mut); margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
  a.card { display:flex; flex-direction:column; gap:6px; padding:20px 18px; border-radius:16px; background:linear-gradient(160deg,var(--card2),var(--card)); border:1px solid #262a40; color:var(--txt); text-decoration:none; transition:transform .15s, border-color .15s, box-shadow .15s; }
  a.card:hover { transform:translateY(-3px); border-color:var(--acc); box-shadow:0 10px 30px -10px rgba(124,92,255,.5); }
  .ico { font-size:2rem; }
  .name { font-weight:650; font-size:1.05rem; }
  .desc { color:var(--mut); font-size:.85rem; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>🎮 Proiectele <span>mele</span></h1>
  <p>Apasă pe un card ca să pornești jocul sau aplicația.</p>
  <input id="q" type="search" placeholder="Caută…" autocomplete="off">
</header>

<main id="list"></main>

<script>
const BASE = "https://v3ng3ance.github.io/gemstorm/";
const groups = [
  { title: "Jocuri arcade", items: [
    ["apex_circuit.html", "🏎️", "Apex Circuit", "Curse pseudo-3D"],
    ["sky-raptor.html", "✈️", "Sky Raptor", "Shooter aerian"],
    ["iron-front.html", "🪖", "Iron Front", "Joc de război"],
    ["iron-front-2.html", "🛡️", "Iron Front 2", "Continuarea"],
    ["snake.html", "🐍", "Snake", "Clasicul șarpe"],
    ["zuma-game.html", "🐸", "Zuma", "Trage bile colorate"],
    ["ultimul-far.html", "🗼", "Ultimul Far", "Tower defense"],
    ["biliard.html", "🎱", "Biliard", "Masă de biliard"],
  ]},
  { title: "Puzzle", items: [
    ["gemstorm.html", "💎", "GemStorm", "Match-3"],
    ["gemblast.html", "✨", "GemBlast", "Match-3 cu bonusuri"],
    ["candy-crunch.html", "🍬", "Candy Crunch", "Match-3 cu bomboane"],
    ["mahjong.html", "🀄", "Mahjong", "Perechi de piese"],
  ]},
  { title: "Cărți & cazino", items: [
    ["septica.html", "🃏", "Șeptică", "Joc de cărți"],
    ["cruce.html", "♣️", "Cruce", "Joc de cărți"],
    ["pacanele.html", "🎰", "Păcănele", "Slot machine"],
  ]},
  { title: "Aplicații", items: [
    ["tv-romania.html", "📺", "TV România Live", "Posturi TV online"],
    ["ctp-cluj.html", "🚌", "CTP Cluj", "Autobuze în timp real"],
    ["chordvision_web.html", "🎸", "ChordVision", "Detectare acorduri"],
    ["gestiune-financiara.html", "💰", "Gestiune financiară", "Evidență bani"],
  ]},
];

const list = document.getElementById("list");
for (const g of groups) {
  const s = document.createElement("section");
  s.innerHTML = `<h2>${g.title}</h2><div class="grid"></div>`;
  const grid = s.querySelector(".grid");
  for (const [file, ico, name, desc] of g.items) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = BASE + file;
    a.dataset.k = (name + " " + desc + " " + file).toLowerCase();
    a.innerHTML = `<div class="ico">${ico}</div><div class="name">${name}</div><div class="desc">${desc}</div>`;
    grid.appendChild(a);
  }
  list.appendChild(s);
}

document.getElementById("q").addEventListener("input", e => {
  const v = e.target.value.toLowerCase().trim();
  document.querySelectorAll("section").forEach(sec => {
    let any = false;
    sec.querySelectorAll("a.card").forEach(c => {
      const show = !v || c.dataset.k.includes(v);
      c.classList.toggle("hidden", !show);
      if (show) any = true;
    });
    sec.classList.toggle("hidden", !any);
  });
});
</script>
</body>
</html>
