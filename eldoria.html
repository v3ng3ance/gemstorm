<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cronicile Eldoriei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: high-fantasy JRPG/ARPG, warm and adventurous
   IDEA: an illuminated adventurer's journal framing a living world
   PICTURE: the game world itself, full screen, procedurally drawn
   COLOUR and TYPE: deep plum leather + gilded gold, Cinzel Decorative titles, Alegreya Sans text
   LAYOUT: full-bleed canvas, HUD in corners, panels as gilded parchment-dark cards */
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07050b;font-family:'Alegreya Sans',system-ui,sans-serif;color:#f3ead7;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;display:block}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.gild{background:linear-gradient(160deg,#2c2138f2,#17111ff2);border:2px solid #c9a24a;border-radius:12px;box-shadow:0 0 0 1px #3a2a10,0 0 0 4px #c9a24a22,0 12px 40px #000c}
#hud{position:fixed;left:12px;top:12px;display:flex;gap:10px;align-items:center;pointer-events:none;z-index:5}
#lvlB{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffeeb5,#d39b32 55%,#6b4512);border:3px solid #2a1d0c;box-shadow:0 0 0 2px #e6c36a,0 4px 10px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2a1a05;font-weight:800;font-size:21px;line-height:1}
#lvlB small{font-size:9px;letter-spacing:.5px}
.bar{position:relative;width:min(220px,42vw);height:17px;background:#140e1acc;border:2px solid #2a1d0c;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1px #c9a24a99;margin-bottom:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .12s}
.bar.hp i{background:linear-gradient(#ff8a78,#c4262c 60%,#7e1217)}
.bar.mp i{background:linear-gradient(#8fd2ff,#2b68d4 60%,#163a86)}
.bar.xp{height:9px}.bar.xp i{background:linear-gradient(#ffe896,#d9a020)}
.bar span{position:absolute;inset:0;text-align:center;font-size:12px;font-weight:800;line-height:13px;text-shadow:0 1px 2px #000,0 0 3px #000}
#goldRow{font-weight:800;font-size:14px;text-shadow:0 1px 2px #000;color:#ffd770}
#mmWrap{position:fixed;right:12px;top:12px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
#mapName{font-family:'Cinzel Decorative',serif;font-size:13px;color:#ffe0a0;text-shadow:0 1px 3px #000;padding:2px 10px;background:#140e1acc;border:1px solid #c9a24a88;border-radius:20px}
#mm{width:160px;height:118px;border:2px solid #c9a24a;border-radius:8px;background:#000;box-shadow:0 4px 14px #000a;image-rendering:pixelated}
#tracker{max-width:220px;font-size:13px;text-align:right;text-shadow:0 1px 2px #000,0 0 4px #000}
#tracker div{margin-top:4px;line-height:1.2}
#tracker b{color:#ffd770;display:block;font-size:13px}
#tracker .ok{color:#8dff8d}
#topBtns{position:fixed;right:184px;flex-wrap:wrap;max-width:240px;justify-content:flex-end;top:12px;z-index:6;display:flex;gap:6px}
#topBtns button{width:40px;height:40px;border-radius:10px;font-size:19px;background:#1c1424dd;border:2px solid #c9a24a99;box-shadow:0 3px 8px #0008}
#topBtns button:hover{border-color:#ffd770}
#bossBar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;width:min(460px,60vw);text-align:center;pointer-events:none}
#bossName{font-family:'Cinzel Decorative',serif;font-size:16px;color:#ffb0a0;text-shadow:0 2px 4px #000}
.bb{height:14px;border:2px solid #2a0a0a;border-radius:8px;background:#1a0808;overflow:hidden;box-shadow:0 0 0 1px #c9443a,0 0 18px #ff3a2055}
.bb i{display:block;height:100%;background:linear-gradient(#ff6a4a,#a01818);transition:width .15s}
#skillbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;padding:7px;border-radius:14px;background:#140e1acc;border:2px solid #c9a24a88}
.slot{position:relative;width:50px;height:50px;border-radius:10px;background:radial-gradient(circle at 40% 30%,#3d2f4d,#1a1222);border:2px solid #6b5530;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;cursor:pointer;touch-action:none}
.slot .key{position:absolute;left:3px;top:1px;font-size:11px;font-weight:800;color:#ffd770;text-shadow:0 1px 2px #000}
.slot .cnt{position:absolute;right:3px;bottom:1px;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000}
.slot .cdv{position:absolute;left:0;right:0;bottom:0;background:#000a;height:0}
.slot .lock{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#bbb}
.slot.nomp{border-color:#3060c0}
.slot.sep{margin-left:8px}
#toasts{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:7px 16px;border-radius:20px;background:#1a1222e6;border:1px solid #c9a24a99;font-weight:700;font-size:15px;text-shadow:0 1px 2px #000;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:6;pointer-events:none;font-family:'Cinzel Decorative',serif;font-size:clamp(28px,5vw,52px);color:#ffe3a3;text-shadow:0 0 18px #c9a24a,0 3px 6px #000;opacity:0;transition:opacity .6s}
#banner small{display:block;font-family:'Alegreya Sans';font-size:16px;letter-spacing:2px;color:#e8d8b8;margin-top:6px}
#banner.show{opacity:1}
#prompt{position:fixed;z-index:6;transform:translate(-50%,-100%);padding:4px 10px;border-radius:8px;background:#140e1ae6;border:1px solid #ffd770;font-size:14px;font-weight:700;pointer-events:none;white-space:nowrap}
#prompt kbd{background:#ffd770;color:#2a1a05;border-radius:4px;padding:0 5px;margin-right:5px;font-family:inherit}
#dialog{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(780px,96vw);z-index:9;display:flex;gap:14px;padding:14px}
#portrait{width:96px;height:96px;flex:none;border-radius:10px;border:2px solid #c9a24a;background:#2a1f36}
.dbody{flex:1;display:flex;flex-direction:column;gap:8px}
#dName{font-family:'Cinzel Decorative',serif;color:#ffd770;font-size:17px}
#dText{font-size:18px;line-height:1.4;white-space:pre-line;min-height:52px;cursor:pointer}
#dOpts{display:flex;flex-wrap:wrap;gap:8px}
#dOpts button,.btn{padding:9px 16px;min-height:44px;border-radius:9px;background:linear-gradient(#4a3760,#2a1e38);border:1.5px solid #c9a24a;font-weight:700;font-size:15px}
#dOpts button:hover,.btn:hover{background:linear-gradient(#5e4778,#352648);border-color:#ffe08a}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,96vw);max-height:88vh;z-index:9;display:flex;flex-direction:column}
.ptitle{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #c9a24a66;font-family:'Cinzel Decorative',serif;font-size:19px;color:#ffd770}
.ptitle button{width:40px;height:40px;border-radius:8px;background:#0004;border:1px solid #c9a24a88;font-size:18px}
#pBody{padding:14px 16px;overflow:auto}
.invg{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px}
@media(max-width:620px){.invg{grid-template-columns:minmax(0,1fr)}#topBtns{right:12px;top:auto;bottom:auto;top:150px;flex-direction:column}#mm{width:120px;height:90px}.bar{width:38vw}}
.eqs{display:flex;flex-direction:column;gap:6px}
.eq{display:flex;align-items:center;gap:8px;padding:6px;border-radius:9px;background:#0003;border:1px solid #6b5530;cursor:pointer;min-height:44px}
.eq .ic{font-size:24px;width:32px;text-align:center}
.eq small{display:block;color:#bba;font-size:12px}
.stats{margin-top:10px;font-size:14px;line-height:1.6}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed #ffffff18}
.stats b{color:#ffd770}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.it{position:relative;aspect-ratio:1;border-radius:9px;background:radial-gradient(circle at 40% 30%,#3d2f4d,#1a1222);border:1.5px solid #6b5530;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.it:hover{border-color:#ffd770}
.it span{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000}
.info{margin-top:10px;min-height:46px;padding:8px 10px;border-radius:8px;background:#0003;font-size:14px;color:#e8dcc4}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #ffffff14}
.row .ic{font-size:26px;width:36px;text-align:center}
.row .nm{flex:1}.row .nm small{display:block;color:#bba;font-size:13px}
.row .pr{color:#ffd770;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{padding:8px 16px;min-height:40px;border-radius:8px;background:#0003;border:1px solid #6b5530;font-weight:700}
.tabs button.on{background:#4a3760;border-color:#ffd770}
.q{padding:10px;border-radius:9px;background:#0003;border:1px solid #6b5530;margin-bottom:8px}
.q b{color:#ffd770;font-size:16px}.q p{font-size:14px;color:#e0d4bc;margin:3px 0}
.q .pg{font-weight:800}.q.done{opacity:.55}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0a061088,#05030aee);padding:16px}
.ocard{text-align:center;max-width:620px;padding:28px 24px}
.ocard h1{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(34px,7vw,58px);line-height:1.05;color:#ffe3a3;text-shadow:0 0 24px #c9a24a88,0 4px 8px #000;text-wrap:balance}
.ocard h2{font-family:'Cinzel Decorative',serif;font-size:18px;color:#d9b8ff;margin:8px 0 18px}
.ocard p{font-size:16px;color:#e4d8c2;line-height:1.5;margin-bottom:16px}
.ocard .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.ocard .btn{font-size:17px;padding:12px 26px}
.hn{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;color:#ffd770;margin:0 auto 16px;max-width:280px}
.hn input{width:100%;min-height:44px;font:inherit;font-size:18px;text-align:center;color:#fff;background:#0006;border:1.5px solid #c9a24a;border-radius:9px;padding:6px 10px;outline:none}
.hn input:focus{border-color:#ffe08a;box-shadow:0 0 0 3px #c9a24a44}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px}
.lb{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:20px;background:#0004;border:1px solid #6b5530;font-weight:700;font-size:14px}
.lb .fl{font-size:18px}
.lb.on{background:#4a3760;border-color:#ffd770;color:#ffe08a}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;text-align:left;font-size:14px;color:#cfc2a8}
.help kbd{display:inline-block;min-width:22px;text-align:center;background:#ffd77022;border:1px solid #c9a24a88;border-radius:4px;padding:0 5px;margin-right:6px;color:#ffd770;font-family:inherit;font-weight:700}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15;transition:opacity .3s}
/* touch */
#joyZone{position:fixed;left:0;bottom:0;width:50vw;height:65vh;z-index:4;touch-action:none}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff44;background:#ffffff12;transform:translate(-50%,-50%);pointer-events:none;z-index:4}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#ffd77088;border:2px solid #ffd770}
#tAtk,#tE{position:fixed;z-index:6;border-radius:50%;border:3px solid #c9a24a;background:radial-gradient(circle at 40% 30%,#6a4a7a,#2a1a36);font-size:34px;touch-action:none}
#tAtk{right:22px;bottom:26px;width:86px;height:86px}
#tE{right:120px;bottom:120px;width:60px;height:60px;font-size:24px}
body.touch #skillbar{left:auto;right:118px;bottom:16px;transform:none;flex-wrap:wrap;width:auto;max-width:200px;justify-content:flex-end;gap:5px;padding:5px;background:transparent;border:0}
body.touch .slot{width:46px;height:46px}
body.touch .slot.sep{margin-left:0}
body.touch #hud{transform:scale(.9);transform-origin:left top}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide">
  <div id="lvlB"><small>NIVEL</small><span id="lvlT">1</span></div>
  <div>
    <div class="bar hp"><i id="hpF"></i><span id="hpT"></span></div>
    <div class="bar mp"><i id="mpF"></i><span id="mpT"></span></div>
    <div class="bar xp"><i id="xpF"></i></div>
    <div id="goldRow"><span id="heroT" style="color:#fff2d0;margin-right:10px"></span>🪙 <span id="goldT">0</span></div>
  </div>
</div>
<div id="mmWrap" class="hide"><div id="mapName"></div><canvas id="mm" width="160" height="118"></canvas><div id="tracker"></div></div>

<div id="panel" class="gild hide"><div class="ptitle"><span id="pTitle"></span><button id="pClose" aria-label="Închide">✕</button></div><div id="pBody"></div></div>

<script>
{
'use strict';
// ================= SETUP =================
const TS=32,$=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
let W=0,H=0,DPR=1,ZOOM=1;
const TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';lc.width=cv.width;lc.height=cv.height;ZOOM=Math.max(1,Math.min(2.3,Math.min(W/(TS*19),H/(TS*12))));}
addEventListener('resize',resize);resize();
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[(Math.random()*a.length)|0];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return Math.abs(d)};
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7);c.fill()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,7);c.fill()}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fill()}
let FL=false;const K=col=>FL?'#ffffff':col;
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=(n>>16)+a,g=(n>>8&255)+a,b=(n&255)+a;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
function mkGlow(rgb){const g=document.createElement('canvas');g.width=g.height=128;const c=g.getContext('2d');const gr=c.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.35,`rgba(${rgb},.75)`);gr.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=gr;c.fillRect(0,0,128,128);return g}
const GLOW=mkGlow('0,0,0'),GL_FIRE=mkGlow('255,140,50'),GL_CYAN=mkGlow('90,220,255'),GL_GOLD=mkGlow('255,220,120'),GL_RED=mkGlow('255,60,40');

// ================= AUDIO =================
let AC=null,master=null,muted=false,musNext=0,musStep=0,musIdx=4;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.45;master.connect(AC.destination)}catch(e){AC=null}}
function toneAt(f,d,type,v,t,slide){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function tone(f,d,type,v,slide,delay){if(AC)toneAt(f,d,type,v,AC.currentTime+(delay||0),slide)}
let NB=null;
function noise(d,v,freq){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;const g=AC.createGain();const t=AC.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
 swing:()=>noise(.12,.18,2200),
 hit:()=>{tone(200,.09,'square',.08,-90);noise(.07,.18,700)},
 fire:()=>{noise(.35,.14,900);tone(320,.25,'sawtooth',.05,-220)},
 boom:()=>{noise(.7,.35,250);tone(90,.5,'sine',.25,-50)},
 coin:()=>{tone(988,.07,'square',.06);tone(1319,.14,'square',.06,0,.06)},
 lvl:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.13,0,i*.09)),
 hurt:()=>tone(150,.22,'sawtooth',.12,-70),
 heal:()=>[660,880,1100].forEach((f,i)=>tone(f,.3,'sine',.1,0,i*.07)),
 quest:()=>[392,523,659,784].forEach((f,i)=>tone(f,.25,'triangle',.11,0,i*.11)),
 talk:()=>tone(520+Math.random()*260,.035,'square',.025),
 pick:()=>tone(740,.1,'triangle',.1,300),
 err:()=>tone(160,.15,'square',.06),
 die:()=>[392,330,262,196].forEach((f,i)=>tone(f,.4,'triangle',.13,0,i*.2)),
 dash:()=>noise(.18,.15,1400),
 chest:()=>[523,784,1047].forEach((f,i)=>tone(f,.2,'square',.06,0,i*.08)),
 thunder:()=>{noise(.9,.3,180)}

  dragon:{n:"Umbra lui Vorthrax",desc:"Învinge-l pe Vorthrax, Dragonul de Foc, în arena din nordul ruinelor.",offer:"Acum știu adevărul: Vorthrax, dragonul străvechi, s-a trezit sub ruine. El l-a trezit pe Kragmor. Până nu cade Vorthrax, Eldoria nu va cunoaște pacea. Mergi, {hero}.",prog:"Arena lui Vorthrax e în nordul Ruinelor de Foc. Când inspiră adânc, fugi din calea flăcărilor!",done:"Vorthrax... a fost învins? Clopotele vor bate în toată Eldoria! Numele de {hero} va fi cântat de bărzi o mie de ani."}}},

 npc:{mirel:["Elder Eldrin",["Our village was peaceful once... until the darkness woke beneath the earth.","The old ones say a dragon sleeps under the Ember Ruins. I hope it isn't true."]],
  dorin:["Brom the Smith",["Good steel never lies. Need a new blade?","My hammer has forged more swords than you've seen sunrises."]],
  ilinca:["Selene the Healer",["Herbs heal the body. The soul... that's another story.","Take care of yourself, {hero}. Potions don't grow on trees. Well, some do."]],
  nelu:["Little Pip",["When I grow up, I'll be a hero just like you!","Did you know the fish in the pond can talk? Just very, very quietly."]],
  radu:["Guard Garrick",["Beyond this gate lie the Ember Ruins. Few have returned.","I stand guard day and night. At least the view is nice."]],
  ana:["Lyra",["Have you heard? They say fire glows above the northern mountains at night!","The fountain in the square has healing water. Drink up, it's free!"]],
  toma:["Odo",["The harvest is poor this year. Those cursed slimes...","Brom the Smith makes the finest swords in the whole land."]],
  mitzi:["Mochi",[]],mitzi_f:["Mochi",[]],fountain:["Healing fountain",[]],
  vasile:["Fennick the Forester",["The forest has eyes, stranger. Wolves hunt in the east, past the river.","Moon mushrooms only grow where moonlight slips through the leaves.","I sell potions to travelers. Honest prices, on my forester's word."]],
  gica:["Durgan the Miner",["I got lost three days ago... or three weeks? The sun never rises down here.","Kragmor, the crystal golem, guards the great hall. When he raises his arms — run!","I've got a few potions in my pack. Cheap, just get rid of these monsters."]],
  spirit:["Spirit of King Aurelian",["I was king of these lands. Vorthrax burned my throne and my citadel.","Lava flows where gardens once bloomed. Avenge my people, {hero}.","Come to me whenever you wish. The strength of the ancestors will heal you."]]},

 q:{slimes:{n:"Slime invasion",desc:"Kill 6 slimes in the Whispering Woods, east of the village.",offer:"Welcome, {hero}! The slimes from the Whispering Woods are devouring our crops. Could you slay six of them?",prog:"The woods are to the east, along the main road. Slimes are slow, but don't underestimate them.",done:"Wonderful! The village is in your debt. Take these coins and some potions."},
  mush:{n:"Moon mushrooms",desc:"Gather 5 moon mushrooms in the Whispering Woods.",offer:"I need moon mushrooms for a powerful remedy. They grow in the forest clearings and glow blue. Will you bring me five?",prog:"Look for the bluish glow between the trees.",done:"Perfect, still wet with dew! Take these potions, I made them with care."},
  cat:{n:"The lost cat",desc:"Find Mochi, Pip's cat, somewhere in the woods.",offer:"Mochi ran into the woods chasing a butterfly and never came back! She's orange and fluffy... Will you help me find her? 😢",prog:"Mochi loves sunny clearings. Please find her!",done:"MOCHI! Thank you, {hero}! Take my lucky talisman — you need it more than I do."},
  wolves:{n:"The eastern pack",desc:"Kill 5 grey wolves beyond the forest river.",offer:"Hunters say a wolf pack crossed the river and is closing in on the village. Stop them before they attack someone — five wolves should scare off the rest.",prog:"The wolves hunt in the eastern part of the woods, past the wooden bridge.",done:"You have the heart of a true hero. But I fear the wolves were fleeing from something worse..."},
  crystal:{n:"Crystals for the smith",desc:"Bring Brom 6 crystal shards from the Crystal Cavern.",offer:"I want to forge a crystal blade, like my grandfather did. The bats and skeletons in the cavern carry crystal shards. Bring me six and the blade is yours!",prog:"The cavern is at the eastern end of the woods. Bring potions — it's pitch dark in there.",done:"Behold... the Crystal Blade! It sings when it cuts the air. Wield it with honor, {hero}."},
  golem:{n:"Heart of the cavern",desc:"Defeat Kragmor, the Crystal Golem, deep in the cavern.",offer:"I've learned why the animals flee. Kragmor, a crystal golem, has awakened deep in the cavern and is poisoning the land. It's a hard task... but you are our only hope.",prog:"Kragmor waits in the great hall at the eastern end of the cavern. Beware when he raises his arms!",done:"Kragmor has fallen! The land breathes again. Guard Garrick will now open the northern gate for you."},
  imps:{n:"Fire imps",desc:"Kill 8 fire imps in the Ember Ruins.",offer:"Now that the gate is open, fire imps come at night to burn our barns. Go to the ruins and slay eight of them.",prog:"Imps throw fire from afar. Close in on them fast!",done:"Not a single barn burned in three nights! Take these, you'll need them against the dragon."},
  dragon:{n:"The Shadow of Vorthrax",desc:"Defeat Vorthrax, the Fire Dragon, in the arena north of the ruins.",offer:"Now I know the truth: Vorthrax, the ancient dragon, has awakened beneath the ruins. He is the one who woke Kragmor. Until Vorthrax falls, Eldoria will know no peace. Go, {hero}.",prog:"Vorthrax's arena lies north of the Ember Ruins. When he takes a deep breath, get out of the flames' path!",done:"Vorthrax... defeated? The bells will ring throughout Eldoria! Bards will sing the name of {hero} for a thousand years."}}},

 npc:{mirel:["Ältester Eldrin",["Unser Dorf war einst friedlich... bis die Dunkelheit unter der Erde erwachte.","Die Alten sagen, unter den Glutruinen schlafe ein Drache. Ich hoffe, das stimmt nicht."]],
  dorin:["Schmied Brom",["Guter Stahl lügt nie. Brauchst du eine neue Klinge?","Mein Hammer hat mehr Schwerter geschmiedet, als du Sonnenaufgänge gesehen hast."]],
  ilinca:["Heilerin Selene",["Kräuter heilen den Körper. Die Seele... das ist eine andere Geschichte.","Pass auf dich auf, {hero}. Tränke wachsen nicht auf Bäumen. Na ja, manche schon."]],
  nelu:["Der kleine Pip",["Wenn ich groß bin, werde ich ein Held wie du!","Wusstest du, dass die Fische im Teich sprechen? Nur ganz, ganz leise."]],
  radu:["Wächter Garrick",["Hinter diesem Tor liegen die Glutruinen. Nur wenige kehrten zurück.","Ich halte Tag und Nacht Wache. Wenigstens ist die Aussicht schön."]],
  ana:["Lyra",["Hast du gehört? Nachts soll über den Nordbergen Feuer leuchten!","Der Brunnen auf dem Platz hat heilendes Wasser. Trink nur, es ist umsonst!"]],
  toma:["Odo",["Die Ernte ist dieses Jahr schlecht. Diese verfluchten Schleime...","Schmied Brom macht die besten Schwerter im ganzen Land."]],
  mitzi:["Mochi",[]],mitzi_f:["Mochi",[]],fountain:["Heilender Brunnen",[]],
  vasile:["Förster Fennick",["Der Wald hat Augen, Fremder. Im Osten, hinter dem Fluss, jagen die Wölfe.","Mondpilze wachsen nur dort, wo das Mondlicht durch die Blätter fällt.","Ich verkaufe Tränke an Reisende. Ehrliche Preise, Försterehrenwort."]],
  gica:["Bergmann Durgan",["Ich habe mich vor drei Tagen verirrt... oder drei Wochen? Hier unten geht nie die Sonne auf.","Kragmor, der Kristallgolem, bewacht die große Halle. Wenn er die Arme hebt — lauf!","Ich habe ein paar Tränke im Rucksack. Billig, wenn du nur diese Monster loswirst."]],
  spirit:["Geist von König Aurelian",["Ich war König dieser Lande. Vorthrax verbrannte meinen Thron und meine Burg.","Lava fließt, wo einst Gärten blühten. Räche mein Volk, {hero}.","Komm zu mir, wann immer du willst. Die Kraft der Ahnen wird dich heilen."]]},
 items:{potion_s:["Kleiner Trank"],potion_l:["Großer Trank"],ether:["Manaelixier"],sword_wood:["Holzschwert"],sword_iron:["Eisenschwert"],sword_steel:["Stahlschwert"],sword_crystal:["Kristallklinge"],sword_flame:["Flamberge"],tunic:["Stofftunika"],leather:["Lederrüstung"],chain:["Eisenkettenhemd"],plate:["Plattenrüstung"],ring_hp:["Ring der Lebenskraft"],amulet_mp:["Arkanes Amulett"],talisman:["Glückstalisman"],mushroom:["Mondpilz","Leuchtet schwach im Dunkeln. Selene braucht sie."],shard:["Kristallsplitter","Kalt und summend. Schmied Brom sucht danach."]},

 mon:{slime:"Schleim",wolf:"Grauwolf",bat:"Fledermaus",skeleton:"Skelett",golem:"Kragmor, der Kristallgolem",imp:"Feuerkobold",demon:"Lavadämon",dragon:"Vorthrax, der Feuerdrache"},
 sk:[["Feuerball","Ein Geschoss, das beim Aufprall explodiert."],["Heilung","Stellt etwa ein Drittel deiner Gesundheit her."],["Stahlwirbel","Trifft alle Gegner um dich herum."],["Meteor","Ein verheerender Meteor schlägt im Ziel ein."]],
 q:{slimes:{n:"Schleiminvasion",desc:"Töte 6 Schleime im Flüsterwald östlich des Dorfes.",offer:"Willkommen, {hero}! Die Schleime aus dem Flüsterwald fressen unsere Ernte. Kannst du sechs von ihnen erledigen?",prog:"Der Wald liegt im Osten, an der Hauptstraße. Schleime sind langsam, aber unterschätze sie nicht.",done:"Wunderbar! Das Dorf steht in deiner Schuld. Nimm diese Münzen und ein paar Tränke."},
  mush:{n:"Mondpilze",desc:"Sammle 5 Mondpilze im Flüsterwald.",offer:"Ich brauche Mondpilze für ein starkes Heilmittel. Sie wachsen auf den Waldlichtungen und leuchten blau. Bringst du mir fünf?",prog:"Halte Ausschau nach dem bläulichen Schimmer zwischen den Bäumen.",done:"Perfekt, noch taufrisch! Nimm diese Tränke, mit Liebe gebraut."},
  cat:{n:"Die verlorene Katze",desc:"Finde Mochi, Pips Katze, irgendwo im Wald.",offer:"Mochi ist einem Schmetterling in den Wald nachgelaufen und nicht zurückgekommen! Sie ist orange und flauschig... Hilfst du mir, sie zu finden? 😢",prog:"Mochi liegt gern auf sonnigen Lichtungen. Bitte finde sie!",done:"MOCHI! Danke, {hero}! Nimm meinen Glückstalisman — du brauchst ihn mehr als ich."},
  wolves:{n:"Das Rudel im Osten",desc:"Töte 5 Grauwölfe jenseits des Waldflusses.",offer:"Die Jäger sagen, ein Wolfsrudel hat den Fluss überquert und nähert sich dem Dorf. Halte sie auf, bevor sie jemanden angreifen — fünf Wölfe sollten den Rest verscheuchen.",prog:"Die Wölfe jagen im östlichen Teil des Waldes, hinter der Holzbrücke.",done:"Du hast das Herz eines wahren Helden. Doch ich fürchte, die Wölfe flohen vor etwas Schlimmerem..."},
  crystal:{n:"Kristalle für den Schmied",desc:"Bring Brom 6 Kristallsplitter aus der Kristallhöhle.",offer:"Ich will eine Kristallklinge schmieden, wie mein Großvater. Die Fledermäuse und Skelette der Höhle tragen Kristallsplitter. Bring mir sechs, und die Klinge gehört dir!",prog:"Die Höhle liegt am östlichen Ende des Waldes. Nimm Tränke mit — dort ist es stockfinster.",done:"Sieh nur... die Kristallklinge! Sie singt, wenn sie die Luft schneidet. Trage sie mit Ehre, {hero}."},
  golem:{n:"Das Herz der Höhle",desc:"Besiege Kragmor, den Kristallgolem, tief in der Höhle.",offer:"Ich weiß jetzt, warum die Tiere fliehen. Kragmor, ein Kristallgolem, ist tief in der Höhle erwacht und vergiftet das Land. Eine schwere Aufgabe... aber du bist unsere einzige Hoffnung.",prog:"Kragmor wartet in der großen Halle am östlichen Ende der Höhle. Hüte dich, wenn er die Arme hebt!",done:"Kragmor ist gefallen! Das Land atmet wieder. Wächter Garrick öffnet dir nun das Nordtor."},
  imps:{n:"Feuerkobolde",desc:"Töte 8 Feuerkobolde in den Glutruinen.",offer:"Seit das Tor offen ist, kommen nachts Feuerkobolde und brennen unsere Scheunen nieder. Geh in die Ruinen und erledige acht von ihnen.",prog:"Kobolde werfen aus der Ferne mit Feuer. Komm ihnen schnell nahe!",done:"Drei Nächte ohne brennende Scheune! Nimm das, gegen den Drachen wirst du es brauchen."},
  dragon:{n:"Der Schatten von Vorthrax",desc:"Besiege Vorthrax, den Feuerdrachen, in der Arena nördlich der Ruinen.",offer:"Jetzt kenne ich die Wahrheit: Vorthrax, der uralte Drache, ist unter den Ruinen erwacht. Er hat Kragmor geweckt. Solange Vorthrax lebt, findet Eldoria keinen Frieden. Geh, {hero}.",prog:"Die Arena von Vorthrax liegt im Norden der Glutruinen. Wenn er tief Luft holt, weich den Flammen aus!",done:"Vorthrax... besiegt? Die Glocken werden in ganz Eldoria läuten! Barden werden den Namen {hero} tausend Jahre lang besingen."}}},

fr:{flag:"🇫🇷",label:"Français",title:"Chroniques d'Eldoria",sub:"L'Ombre de Vorthrax",

 npc:{mirel:["Le vieil Eldrin",["Notre village était paisible autrefois... jusqu'à ce que les ténèbres s'éveillent sous terre.","Les anciens disent qu'un dragon dort sous les Ruines de Braise. J'espère que c'est faux."]],
  dorin:["Brom le forgeron",["Le bon acier ne ment jamais. Besoin d'une nouvelle lame ?","Mon marteau a forgé plus d'épées que tu n'as vu de levers de soleil."]],
  ilinca:["Selene la guérisseuse",["Les herbes soignent le corps. L'âme... c'est une autre histoire.","Prends soin de toi, {hero}. Les potions ne poussent pas sur les arbres. Enfin, certaines si."]],
  nelu:["Le petit Pip",["Quand je serai grand, je serai un héros comme toi !","Tu savais que les poissons de l'étang parlent ? Juste très, très doucement."]],
  radu:["Le garde Garrick",["Au-delà de cette porte s'étendent les Ruines de Braise. Peu en sont revenus.","Je monte la garde jour et nuit. Au moins, la vue est belle."]],
  ana:["Lyra",["Tu as entendu ? On dit qu'on voit du feu au-dessus des montagnes du nord la nuit !","La fontaine de la place a une eau guérisseuse. Bois, c'est gratuit !"]],
  toma:["Odo",["La récolte est maigre cette année. Ces maudites gelées...","Brom le forgeron fait les meilleures épées du royaume."]],
  mitzi:["Mochi",[]],mitzi_f:["Mochi",[]],fountain:["Fontaine de guérison",[]],
  vasile:["Fennick le forestier",["La forêt a des yeux, étranger. Les loups chassent à l'est, après la rivière.","Les champignons de lune ne poussent que là où la lune perce le feuillage.","Je vends des potions aux voyageurs. Prix honnêtes, parole de forestier."]],
  gica:["Durgan le mineur",["Je me suis perdu il y a trois jours... ou trois semaines ? Le soleil ne se lève jamais ici.","Kragmor, le golem de cristal, garde la grande salle. Quand il lève les bras — fuis !","J'ai quelques potions dans mon sac. Pas cher, débarrasse-nous juste de ces monstres."]],
  spirit:["L'esprit du roi Aurelian",["J'étais le roi de ces terres. Vorthrax a brûlé mon trône et ma citadelle.","La lave coule là où fleurissaient des jardins. Venge mon peuple, {hero}.","Viens me voir quand tu veux. La force des ancêtres te guérira."]]},

 q:{slimes:{n:"L'invasion des gelées",desc:"Tue 6 gelées dans le Bois des Murmures, à l'est du village.",offer:"Bienvenue, {hero} ! Les gelées du Bois des Murmures dévorent nos récoltes. Peux-tu en éliminer six ?",prog:"Le bois est à l'est, sur la grand-route. Les gelées sont lentes, mais ne les sous-estime pas.",done:"Merveilleux ! Le village a une dette envers toi. Prends ces pièces et quelques potions."},
  mush:{n:"Les champignons de lune",desc:"Ramasse 5 champignons de lune dans le Bois des Murmures.",offer:"J'ai besoin de champignons de lune pour un remède puissant. Ils poussent dans les clairières et brillent en bleu. Tu m'en rapportes cinq ?",prog:"Cherche la lueur bleutée entre les arbres.",done:"Parfaits, encore couverts de rosée ! Prends ces potions, préparées avec soin."},
  cat:{n:"La chatte perdue",desc:"Retrouve Mochi, la chatte de Pip, quelque part dans le bois.",offer:"Mochi a couru dans le bois après un papillon et n'est jamais revenue ! Elle est rousse et toute duveteuse... Tu m'aides à la retrouver ? 😢",prog:"Mochi adore les clairières ensoleillées. Retrouve-la, s'il te plaît !",done:"MOCHI ! Merci, {hero} ! Prends mon talisman porte-bonheur — tu en as plus besoin que moi."},
  wolves:{n:"La meute de l'est",desc:"Tue 5 loups gris au-delà de la rivière du bois.",offer:"Les chasseurs disent qu'une meute a traversé la rivière et approche du village. Arrête-les avant qu'ils n'attaquent quelqu'un — cinq loups devraient effrayer les autres.",prog:"Les loups chassent dans la partie est du bois, après le pont en bois.",done:"Tu as le cœur d'un vrai héros. Mais je crains que les loups ne fuyaient quelque chose de pire..."},
  crystal:{n:"Des cristaux pour le forgeron",desc:"Rapporte à Brom 6 éclats de cristal de la Caverne de Cristal.",offer:"Je veux forger une lame de cristal, comme mon grand-père. Les chauves-souris et les squelettes de la caverne portent des éclats. Rapporte-m'en six et la lame est à toi !",prog:"La caverne est au bout est du bois. Prends des potions, il y fait noir comme dans un four.",done:"La voici... la Lame de cristal ! Elle chante quand elle fend l'air. Porte-la avec honneur, {hero}."},
  golem:{n:"Le cœur de la caverne",desc:"Vaincs Kragmor, le Golem de Cristal, au fond de la caverne.",offer:"J'ai compris pourquoi les animaux fuient. Kragmor, un golem de cristal, s'est réveillé au fond de la caverne et empoisonne la terre. C'est une lourde tâche... mais tu es notre seul espoir.",prog:"Kragmor attend dans la grande salle, au bout est de la caverne. Méfie-toi quand il lève les bras !",done:"Kragmor est tombé ! La terre respire à nouveau. Le garde Garrick va t'ouvrir la porte du nord."},
  imps:{n:"Les diablotins de feu",desc:"Tue 8 diablotins de feu dans les Ruines de Braise.",offer:"Depuis que la porte est ouverte, des diablotins viennent la nuit brûler nos granges. Va dans les ruines et élimines-en huit.",prog:"Les diablotins lancent du feu à distance. Rapproche-toi vite !",done:"Pas une grange brûlée depuis trois nuits ! Prends ça, tu en auras besoin face au dragon."},
  dragon:{n:"L'Ombre de Vorthrax",desc:"Vaincs Vorthrax, le Dragon de Feu, dans l'arène au nord des ruines.",offer:"Je connais enfin la vérité : Vorthrax, le dragon ancestral, s'est réveillé sous les ruines. C'est lui qui a réveillé Kragmor. Tant que Vorthrax vivra, Eldoria ne connaîtra pas la paix. Va, {hero}.",prog:"L'arène de Vorthrax se trouve au nord des Ruines de Braise. Quand il inspire profondément, écarte-toi des flammes !",done:"Vorthrax... vaincu ? Les cloches sonneront dans toute l'Eldoria ! Les bardes chanteront le nom de {hero} pendant mille ans."}}},

 npc:{mirel:["El anciano Eldrin",["Nuestra aldea fue tranquila una vez... hasta que la oscuridad despertó bajo la tierra.","Los ancianos dicen que un dragón duerme bajo las Ruinas de Fuego. Espero que no sea cierto."]],
  dorin:["Brom el herrero",["El buen acero nunca miente. ¿Necesitas una hoja nueva?","Mi martillo ha forjado más espadas que amaneceres has visto tú."]],
  ilinca:["Selene la curandera",["Las hierbas curan el cuerpo. El alma... esa es otra historia.","Cuídate, {hero}. Las pociones no crecen en los árboles. Bueno, algunas sí."]],
  nelu:["El pequeño Pip",["¡Cuando sea mayor, seré un héroe como tú!","¿Sabías que los peces del estanque hablan? Solo que muy, muy bajito."]],
  radu:["El guardia Garrick",["Tras esta puerta están las Ruinas de Fuego. Pocos han vuelto.","Hago guardia día y noche. Al menos la vista es bonita."]],
  ana:["Lyra",["¿Te has enterado? ¡Dicen que de noche se ve fuego sobre las montañas del norte!","La fuente de la plaza tiene agua curativa. ¡Bebe, que es gratis!"]],
  toma:["Odo",["La cosecha es pobre este año. Esos malditos limos...","Brom el herrero hace las mejores espadas de toda la comarca."]],
  mitzi:["Mochi",[]],mitzi_f:["Mochi",[]],fountain:["Fuente curativa",[]],
  vasile:["Fennick el guardabosques",["El bosque tiene ojos, forastero. Los lobos cazan al este, pasado el río.","Las setas lunares solo crecen donde la luz de la luna atraviesa las hojas.","Vendo pociones a los viajeros. Precios honrados, palabra de guardabosques."]],
  gica:["Durgan el minero",["Me perdí hace tres días... ¿o tres semanas? Aquí abajo nunca sale el sol.","Kragmor, el gólem de cristal, guarda la gran sala. Cuando levante los brazos, ¡corre!","Tengo unas pociones en la mochila. Baratas, con tal de que acabes con estos monstruos."]],
  spirit:["Espíritu del rey Aurelian",["Fui el rey de estas tierras. Vorthrax quemó mi trono y mi ciudadela.","Corre lava donde antes florecían jardines. Venga a mi pueblo, {hero}.","Ven a mí cuando quieras. La fuerza de los ancestros te sanará."]]},

 q:{slimes:{n:"Invasión de limos",desc:"Mata 6 limos en el Bosque de los Susurros, al este de la aldea.",offer:"¡Bienvenido, {hero}! Los limos del Bosque de los Susurros devoran nuestras cosechas. ¿Podrías acabar con seis de ellos?",prog:"El bosque está al este, por el camino principal. Los limos son lentos, pero no los subestimes.",done:"¡Maravilloso! La aldea está en deuda contigo. Toma estas monedas y unas pociones."},
  mush:{n:"Las setas lunares",desc:"Recoge 5 setas lunares en el Bosque de los Susurros.",offer:"Necesito setas lunares para un remedio poderoso. Crecen en los claros del bosque y brillan de azul. ¿Me traes cinco?",prog:"Busca el brillo azulado entre los árboles.",done:"¡Perfectas, aún húmedas de rocío! Toma estas pociones, hechas con cariño."},
  cat:{n:"La gata perdida",desc:"Encuentra a Mochi, la gata de Pip, en algún lugar del bosque.",offer:"¡Mochi se metió en el bosque persiguiendo una mariposa y no ha vuelto! Es naranja y muy peluda... ¿Me ayudas a encontrarla? 😢",prog:"A Mochi le encantan los claros soleados. ¡Por favor, encuéntrala!",done:"¡MOCHI! ¡Gracias, {hero}! Toma mi talismán de la suerte, tú lo necesitas más que yo."},
  wolves:{n:"La manada del este",desc:"Mata 5 lobos grises al otro lado del río del bosque.",offer:"Los cazadores dicen que una manada de lobos cruzó el río y se acerca a la aldea. Detenlos antes de que ataquen a alguien — cinco lobos deberían ahuyentar al resto.",prog:"Los lobos cazan en la parte este del bosque, pasado el puente de madera.",done:"Tienes el corazón de un verdadero héroe. Pero temo que los lobos huían de algo peor..."},
  crystal:{n:"Cristales para el herrero",desc:"Lleva a Brom 6 fragmentos de cristal de la Caverna de Cristal.",offer:"Quiero forjar una hoja de cristal, como hacía mi abuelo. Los murciélagos y esqueletos de la caverna llevan fragmentos de cristal. ¡Tráeme seis y la hoja será tuya!",prog:"La caverna está al extremo este del bosque. Lleva pociones, allí está oscuro como boca de lobo.",done:"Mírala... ¡la Hoja de cristal! Canta al cortar el aire. Llévala con honor, {hero}."},
  golem:{n:"El corazón de la caverna",desc:"Derrota a Kragmor, el Gólem de Cristal, en lo más hondo de la caverna.",offer:"Ya sé por qué huyen los animales. Kragmor, un gólem de cristal, ha despertado en lo más hondo de la caverna y envenena la tierra. Es una tarea difícil... pero eres nuestra única esperanza.",prog:"Kragmor espera en la gran sala, al extremo este de la caverna. ¡Cuidado cuando levante los brazos!",done:"¡Kragmor ha caído! La tierra respira de nuevo. El guardia Garrick te abrirá ahora la puerta del norte."},
  imps:{n:"Diablillos de fuego",desc:"Mata 8 diablillos de fuego en las Ruinas de Fuego.",offer:"Desde que se abrió la puerta, los diablillos vienen de noche a quemar nuestros graneros. Ve a las ruinas y acaba con ocho.",prog:"Los diablillos lanzan fuego a distancia. ¡Acércate rápido!",done:"¡Ni un granero quemado en tres noches! Toma esto, lo necesitarás contra el dragón."},
  dragon:{n:"La Sombra de Vorthrax",desc:"Derrota a Vorthrax, el Dragón de Fuego, en la arena al norte de las ruinas.",offer:"Ahora sé la verdad: Vorthrax, el dragón ancestral, ha despertado bajo las ruinas. Él despertó a Kragmor. Mientras Vorthrax viva, Eldoria no conocerá la paz. Ve, {hero}.",prog:"La arena de Vorthrax está al norte de las Ruinas de Fuego. ¡Cuando tome aire, apártate de las llamas!",done:"¿Vorthrax... derrotado? ¡Las campanas sonarán en toda Eldoria! Los bardos cantarán el nombre de {hero} durante mil años."}}},

let LANG=(()=>{try{const v=localStorage.getItem('eldoria_lang');if(v&&I18N[v])return v}catch(e){}const n=(navigator.language||'en').slice(0,2).toLowerCase();return I18N[n]?n:'en'})();
const L=()=>I18N[LANG];
function T(k,...a){let v=L().ui[k];if(v===undefined)v=I18N.en.ui[k];if(v===undefined)return k;if(typeof v==='string')a.forEach((x,i)=>{v=v.split('{'+i+'}').join(String(x))});return v}
const HR=t=>String(t).replace(/\{hero\}/g,P.name||'Arin');
function langMap(m){const l=L();[m.name,m.sub]=l.map[m.id];for(const e of m.exits){e.label=l.map[e.to][0];if(e.deny)e.deny=l.ui.deny}for(const n of m.npcDefs){const v=l.npc[n.id];if(v){n.name=v[0];n.lines=v[1]}}}
function applyLang(){const l=L();for(const id in ITEMS){const v=l.items[id];ITEMS[id].n=v[0];if(v[1])ITEMS[id].d=v[1]}for(const k in MON)MON[k].n=l.mon[k];SKILLS.forEach((x,i)=>{x.n=l.sk[i][0];x.d=l.sk[i][1]});for(const k in QUESTS)Object.assign(QUESTS[k],l.q[k]);for(const k in MAPS)langMap(MAPS[k]);if(CM){for(const n of npcs){const v=l.npc[n.id];if(v){n.name=v[0];n.lines=v[1]}}$('mapName').textContent=CM.name}document.documentElement.lang=LANG;document.title=l.title;staticUI();trackerDirty=true;if(bossM)$('bossName').textContent=bossM.d.n;if(panelType)renderPanel()}
function staticUI(){$('lvlB').querySelector('small').textContent=T('level');const ts={inv:'invB',quests:'qB',sound:'sndB',save:'saveB',lang:'langB'};document.querySelectorAll('#topBtns button').forEach(b=>b.title=T(ts[b.dataset.a]));slotEls.forEach((el,i)=>{const x=SLOTS[i];el.title=x.type==='skill'?SKILLS[x.i].n+' — '+SKILLS[x.i].d+' ('+SKILLS[x.i].mp+' MP)':x.type==='pot'?T('potHp'):x.type==='eth'?T('potMp'):T('dodge')})}

const G=0,PATH=1,WATER=2,TREE=3,ROCK=4,FLOOR=5,BLOCK=6,FLOWER=7,SAND=8,LAVA=9,BRIDGE=10,FENCE=11,STONE=12,DGRASS=13,CRYSTAL=14,PILLAR=15,ASH=16;
const SOLID=new Set([WATER,TREE,ROCK,BLOCK,FENCE,CRYSTAL,PILLAR,LAVA]);

function newMap(w,h,f){return{w,h,t:new Uint8Array(w*h).fill(f),props:[],live:[],npcDefs:[],exits:[],spawns:[],items:[],chests:[],lights:[],chestPos:[]}}
const gt=(m,x,y)=>(x<0||y<0||x>=m.w||y>=m.h)?ROCK:m.t[y*m.w+x];
function put(m,x,y,v){if(x<0||y<0||x>=m.w||y>=m.h)return;const i=y*m.w+x;m.t[i]=typeof v==='function'?v(m.t[i]):v}
function rect(m,x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)put(m,i,j,v)}
function disc(m,cx,cy,r,v,rg,jit){for(let j=-r-2;j<=r+2;j++)for(let i=-r-2;i<=r+2;i++){const d=Math.hypot(i,j)+(rg?(rg()-.5)*(jit||0):0);if(d<=r+.3)put(m,cx+i,cy+j,v)}}
function line(m,pts,wd,v){for(let k=0;k<pts.length-1;k++){const a=pts[k],b=pts[k+1];const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*2)||1;for(let s=0;s<=n;s++){const x=Math.round(a[0]+(b[0]-a[0])*s/n),y=Math.round(a[1]+(b[1]-a[1])*s/n);for(let j=-wd;j<=wd;j++)for(let i=-wd;i<=wd;i++)put(m,x+i,y+j,v)}}}
function house(m,x,y,w,h,roof,sign){rect(m,x,y,w,h,BLOCK);m.props.push({k:'house',x,y,w,h,roof,sign})}
const edge=(m,x,y)=>Math.min(x,y,m.w-1-x,m.h-1-y);

const qState=id=>S.quests[id]?S.quests[id].st:null;

function npcQuest(nid){const L=Object.keys(QUESTS).filter(k=>QUESTS[k].giver===nid);for(const k of L)if(qState(k)==='ready')return[k,'ready'];for(const k of L)if(qAvail(k))return[k,'avail'];for(const k of L)if(qState(k)==='active')return[k,'active'];return null}
function questRefresh(){for(const k in S.quests){const q=QUESTS[k],s=S.quests[k];if(s.st==='done')continue;const was=s.st;if(q.type==='collect'){s.n=Math.min(q.need,itemCount(q.target));s.st=s.n>=q.need?'ready':'active'}else if(q.type==='find'){s.n=S.flags[q.target]?1:0;s.st=s.n?'ready':'active'}else s.st=s.n>=q.need?'ready':'active';if(was==='active'&&s.st==='ready'){const g=npcName(q.giver);toast(T('qReady',q.n,g));SFX.quest()}}trackerDirty=true}

 if(i===0){const a=aimAngle(360);faceAng(a);shoot(P,a,'pfire',400,ST.atk*1.7,{r:8,aoe:44,life:1.4});SFX.fire()}
 else if(i===1){const h=Math.round(ST.mhp*.35+P.lvl*5);P.hp=Math.min(ST.mhp,P.hp+h);ftext(P.x,P.y-50,'+'+h,'#7dff8a',17);for(let k=0;k<26;k++){const a=k/26*Math.PI*2;parts.push({x:P.x+Math.cos(a)*22,y:P.y-6+Math.sin(a)*8,vx:0,vy:-rnd(30,80),life:rnd(.6,1),max:1,c:pick(['#9dff9d','#ffffff','#d4ffb0']),s:3,g:0})}flashes.push({x:P.x,y:P.y-20,r:160,t:.5,max:.5,c:GL_GOLD});SFX.heal()}
 else if(i===2){P.whirlT=.45;SFX.swing();setTimeout(()=>SFX.swing(),120);for(const m of mons){const d=dist(m,P);if(d<m.r+80){const am=Math.atan2(m.y-P.y,m.x-P.x);hurtMon(m,ST.atk*1.5,am,280)}}for(let k=0;k<30;k++){const a=k/30*Math.PI*2;parts.push({x:P.x+Math.cos(a)*30,y:P.y-12+Math.sin(a)*20,vx:Math.cos(a)*160,vy:Math.sin(a)*100,life:.4,max:.4,c:pick(['#ffffff','#cfe6ff','#9fd0ff']),s:3,g:0})}}
 else if(i===3){let tx,ty;if(mouseAim()){tx=camX+mx/ZOOM;ty=camY+my/ZOOM}else{const t=nearestMon(380);if(t){tx=t.x;ty=t.y}else{const a=dirAng(P.dir);tx=P.x+Math.cos(a)*140;ty=P.y+Math.sin(a)*140}}faceAng(Math.atan2(ty-P.y,tx-P.x));tels.push({x:tx,y:ty,r:96,t:.7,max:.7,dmg:ST.atk*3.4,kind:'circle',from:'p'});SFX.fire()}}
function usePotion(){if(P.potCd>0)return;const miss=ST.mhp-P.hp;if(miss<=0){toast(T('fullHp'));return}let id=null;if(itemCount('potion_l')&&(miss>=150||!itemCount('potion_s')))id='potion_l';else if(itemCount('potion_s'))id='potion_s';if(!id){toast(T('noPot'));SFX.err();return}useItem(id);P.potCd=.8}
function useEther(){if(P.potCd>0)return;if(!itemCount('ether')){toast(T('noEther'));SFX.err();return}useItem('ether');P.potCd=.8}
function useItem(id){const it=ITEMS[id];if(it.t==='use'){if(it.heal){const h=Math.min(it.heal,ST.mhp-P.hp);P.hp+=h;ftext(P.x,P.y-50,'+'+h,'#7dff8a',16)}if(it.mana){const h=Math.min(it.mana,ST.mmp-P.mp);P.mp+=h;ftext(P.x,P.y-50,'+'+h+' MP','#8fd2ff',15)}removeItem(id,1);SFX.heal();burst(P.x,P.y-20,12,it.heal?['#9dff9d','#fff']:['#8fd2ff','#fff'],60,.7)}else if(['weapon','armor','acc'].includes(it.t))equip(id)}
function equip(id){const it=ITEMS[id],slot=it.t;const old=P.eq[slot];removeItem(id,1);P.eq[slot]=id;if(old)addItem(old,1);ST=stats();P.hp=Math.min(P.hp,ST.mhp);P.mp=Math.min(P.mp,ST.mmp);SFX.pick();toast(T('equipped',it.ic+' '+it.n))}
function unequip(slot){const id=P.eq[slot];if(!id)return;if(slot==='weapon'){toast(T('noWeapon'));return}P.eq[slot]=null;addItem(id,1);ST=stats();P.hp=Math.min(P.hp,ST.mhp);P.mp=Math.min(P.mp,ST.mmp)}
function dash(){if(P.dashCd>0||mode!=='play')return;let dx=P.dx,dy=P.dy;const l=Math.hypot(dx,dy)||1;P.ddx=dx/l;P.ddy=dy/l;P.dashT=.17;P.dashCd=.9;SFX.dash();burst(P.x,P.y-8,10,['#ffffff','#cfd8ff'],60,.4)}
function shoot(src,a,kind,spd,dmg,o){o=o||{};const off=(src.r||10)*.8;projs.push({x:src.x+Math.cos(a)*off,y:src.y+Math.sin(a)*off,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,kind,dmg,from:src===P?'p':'e',r:o.r||7,life:o.life||2.4,aoe:o.aoe||0,h:kind==='rock'?22:18,rot:0})}
function hurtMon(m,base,ang,kb){if(m.hp<=0)return;const crit=Math.random()<ST.crit;let dmg=Math.max(1,Math.round(base*(.85+Math.random()*.3)-m.d.def*.5));if(crit)dmg=Math.round(dmg*1.8);m.hp-=dmg;m.flash=.12;m.aggro=true;if(m.d.boss)showBoss(m);
 if(!m.d.boss&&ang!==undefined){m.kx=Math.cos(ang)*kb;m.ky=Math.sin(ang)*kb}
 ftext(m.x+rnd(-6,6),m.y-m.r*2-8,dmg+(crit?'!':''),crit?'#ffd84a':'#ffffff',crit?20:15);
 const cols=m.type==='slime'?['#7fe87f','#3fb04f']:m.type==='skeleton'?['#f0ead8','#c8c0a8']:m.type==='golem'?['#8ff0ff','#6c7488']:m.type==='bat'?['#a070c0','#ff5050']:['#ff5050','#b02020','#ff9a5a'];
 burst(m.x,m.y-m.r,7,cols,120,.5,300);SFX.hit();if(m.hp<=0)killMon(m)}
function killMon(m){m.dead=true;const d=m.d;gainXP(d.xp);const g=rint(d.gold[0],d.gold[1]);const piles=d.boss?8:1;for(let i=0;i<piles;i++)drops.push({x:m.x+rnd(-20,20)*(d.boss?2:.4),y:m.y+rnd(-12,12)*(d.boss?2:.4),gold:Math.ceil(g/piles),t:0});
 const dropI=id=>drops.push({x:m.x+rnd(-14,14),y:m.y+rnd(-10,10),id,n:1,t:Math.random()*6});
 if(Math.random()<.1)dropI('potion_s');if(Math.random()<.045)dropI('ether');
 for(const[id,ch]of(d.loot||[]))if(Math.random()<ch)dropI(id);
 if(d.drop&&qState('crystal')!=='done'&&Math.random()<d.drop[1])dropI(d.drop[0]);
 burst(m.x,m.y-m.r,d.boss?80:18,m.type==='slime'?['#7fe87f','#bfffbf']:['#ffffff','#cccccc','#ffd770'],d.boss?260:140,d.boss?1.4:.7,200);
 questKill(m.type);
 if(d.boss){S.bossDead[m.type]=1;$('bossBar').classList.add('hide');bossM=null;shake(.8,12);SFX.boom();banner(T('defeated',d.n),'');for(let i=0;i<4;i++)dropI(i%2?'potion_l':'ether');save(true)}
 else if(m.sp)rq.push({sp:m.sp,t:rnd(18,30)})}
function hurtPlayer(base){if(P.inv_t>0||P.hp<=0||P.dashT>0||mode!=='play')return;const dmg=Math.max(1,Math.round(base*(.85+Math.random()*.3)-ST.def*.6));P.hp-=dmg;P.inv_t=.45;P.combatT=5;ftext(P.x,P.y-46,'-'+dmg,'#ff5a5a',17);shake(.15,4);SFX.hurt();burst(P.x,P.y-16,8,['#ff4040','#a01010'],100,.5,300);if(P.hp<=0){P.hp=0;die()}}
function die(){mode='dead';SFX.die();showOverlay('dead')}
function respawn(){ST=stats();P.hp=ST.mhp;P.mp=ST.mmp;const lost=Math.floor(P.gold*.25);P.gold-=lost;P.inv_t=1.5;loadMap('sat',25*TS+16,22*TS+16);mode='play';hideOverlay();if(lost)toast(T('lostGold',lost));save(true)}
function showBoss(m){bossM=m;$('bossBar').classList.remove('hide');$('bossName').textContent=m.d.n}
function openChest(ch){S.picked[ch.uid]=1;SFX.chest();burst(ch.x,ch.y-14,24,['#ffd770','#fff','#ffb030'],140,.8,200);flashes.push({x:ch.x,y:ch.y-10,r:120,t:.5,max:.5,c:GL_GOLD});const L=ch.loot;for(let i=0;i<4;i++)drops.push({x:ch.x+rnd(-24,24),y:ch.y+rnd(8,22),gold:Math.ceil(L.gold/4),t:0});for(const[id,n]of L.items)for(let i=0;i<n;i++)drops.push({x:ch.x+rnd(-20,20),y:ch.y+rnd(10,24),id,n:1,t:Math.random()*6});save(true)}

// ================= MONSTER AI =================
function wander(m,dt){m.wt-=dt;if(m.wt<=0){m.wt=rnd(1.2,3.5);if(Math.random()<.45){m.wx=m.wy=0}else{let a=Math.random()*7;if(Math.hypot(m.x-m.hx,m.y-m.hy)>130)a=Math.atan2(m.hy-m.y,m.hx-m.x);m.wx=Math.cos(a)*m.d.spd*.4;m.wy=Math.sin(a)*m.d.spd*.4}}return[m.wx,m.wy]}
function updateMon(m,dt){const d=m.d;m.flash=Math.max(0,m.flash-dt);m.cd-=dt;m.atkA=Math.max(0,(m.atkA||0)-dt);
 if(Math.abs(m.kx)+Math.abs(m.ky)>4){moveE(m,m.kx*dt,m.ky*dt,m.r*.7);const f=Math.pow(.002,dt);m.kx*=f;m.ky*=f}else m.kx=m.ky=0;
 const dx=P.x-m.x,dy=P.y-m.y,dd=Math.hypot(dx,dy);
 if(!m.aggro&&dd<d.aggro&&P.hp>0){m.aggro=true;if(d.boss){showBoss(m);if(m.type==='dragon')SFX.thunder()}}
 if(m.aggro&&dd>d.aggro*2.2){m.aggro=false}
 let mv=[0,0];const reach=m.r+P.r+6,a=Math.atan2(dy,dx);
 switch(d.ai){
 case 'hop':m.t-=dt;if(m.hopT>0){m.hopT-=dt;mv=[m.vx,m.vy]}else if(m.t<=0){m.t=rnd(.5,1.1);if(!m.aggro&&Math.random()<.4){m.t=1.6;break}let aa=m.aggro?a+rnd(-.3,.3):Math.random()*7;if(!m.aggro&&Math.hypot(m.x-m.hx,m.y-m.hy)>120)aa=Math.atan2(m.hy-m.y,m.hx-m.x);m.vx=Math.cos(aa)*d.spd*2.4;m.vy=Math.sin(aa)*d.spd*2.4;m.hopT=.35}break;
 case 'chase':case 'erratic':if(m.aggro){if(dd>reach-3){let aa=a;if(d.ai==='erratic')aa+=Math.sin(gT*4+m.seed)*1.1;mv=[Math.cos(aa)*d.spd,Math.sin(aa)*d.spd]}}else mv=wander(m,dt);break;
 case 'ranged':if(m.aggro){if(dd>210)mv=[Math.cos(a)*d.spd,Math.sin(a)*d.spd];else if(dd<120)mv=[-Math.cos(a)*d.spd*.8,-Math.sin(a)*d.spd*.8];else{const s=Math.sin(gT*.8+m.seed)>0?1:-1;mv=[-Math.sin(a)*d.spd*.6*s,Math.cos(a)*d.spd*.6*s]}m.t-=dt;if(m.t<=0&&dd<340){m.t=rnd(1.5,2.2);m.atkA=.3;shoot(m,a,'fire',230,d.atk,{r:7})}}else mv=wander(m,dt);break;
 case 'golem':mv=bossGolem(m,dt,dd,a);break;
 case 'dragon':mv=bossDragon(m,dt,dd,a);break}
 if(mv[0]||mv[1]){if(m.type==='dragon'){m.x+=mv[0]*dt;m.y+=mv[1]*dt}else if(moveE(m,mv[0]*dt,mv[1]*dt,m.r*.7)&&m.aggro){m.wt=0}m.moving=true;m.walk+=dt;if(Math.abs(mv[0])>3)m.fx=mv[0]>0?1:-1}else m.moving=false;
 if(m.aggro&&dd<160&&d.ai!=='hop')m.fx=dx>0?1:-1;
 if(d.ai!=='ranged'&&m.aggro&&dd<reach&&m.cd<=0&&P.hp>0){hurtPlayer(d.atk);m.cd=d.boss?1.3:1.0;m.atkA=.25}}
function bossGolem(m,dt,dd,a){const d=m.d,enr=m.hp<m.max*.5;if(!m.aggro)return[0,0];m.a1-=dt;m.a2-=dt;m.a3-=dt;
 if(m.slamT>0){m.slamT-=dt;return[0,0]}
 if(m.a1<=0&&dd<180){m.a1=enr?2.6:3.6;m.slamT=.95;tels.push({x:m.x,y:m.y,r:130,t:.95,max:.95,dmg:d.atk*1.3,kind:'circle',from:'e'});return[0,0]}
 if(m.a2<=0&&dd>90){m.a2=enr?1.6:2.4;shoot(m,a,'rock',270,d.atk*.8,{r:9});if(enr){shoot(m,a+.32,'rock',270,d.atk*.8,{r:9});shoot(m,a-.32,'rock',270,d.atk*.8,{r:9})}}
 if(enr&&m.a3<=0){m.a3=6.5;for(let i=0;i<12;i++)shoot(m,i/12*Math.PI*2,'rock',210,d.atk*.7,{r:8});shake(.3,6);SFX.boom()}
 if(dd>m.r+P.r+4){const s=d.spd*(enr?1.4:1);return[Math.cos(a)*s,Math.sin(a)*s]}return[0,0]}
function bossDragon(m,dt,dd,a){const d=m.d;if(!m.aggro)return[0,0];const hpF=m.hp/m.max;
 if(!m.sum1&&hpF<.6){m.sum1=1;summon(3)}if(!m.sum2&&hpF<.3){m.sum2=1;summon(4)}
 m.a1-=dt;m.breathT=Math.max(0,(m.breathT||0)-dt);if(m.busy>0){m.busy-=dt;return[0,0]}
 if(m.a1<=0){const pk=Math.random();
  if(pk<.4&&dd<300){m.busy=1.3;m.breathT=1.3;m.a1=hpF<.5?2.2:3;tels.push({x:m.x,y:m.y-10,r:300,t:1,max:1,dmg:d.atk*1.4,kind:'cone',ang:a,spread:.5,from:'e'})}
  else if(pk<.75){m.a1=hpF<.5?1.7:2.5;m.busy=.4;for(let i=-2;i<=2;i++)shoot(m,a+i*.17,'fire',300,d.atk*.8,{r:10});SFX.fire()}
  else{m.a1=3.2;m.busy=.7;for(let i=0;i<16;i++)shoot(m,i/16*Math.PI*2+gT,'fire',210,d.atk*.7,{r:10});for(let i=0;i<4;i++)tels.push({x:P.x+rnd(-90,90),y:P.y+rnd(-70,70),r:62,t:1.15,max:1.15,dmg:d.atk*.9,kind:'circle',from:'e',meteor:1});SFX.fire()}}
 let v=[0,0];if(dd>170)v=[Math.cos(a)*d.spd,Math.sin(a)*d.spd];const hd=Math.hypot(m.x-m.hx,m.y-m.hy);if(hd>200){const ha=Math.atan2(m.hy-m.y,m.hx-m.x);v=[Math.cos(ha)*d.spd,Math.sin(ha)*d.spd]}return v}
function summon(n){for(let i=0;i<n;i++){const a=Math.random()*7,mm=spawnMon('imp',bossM?bossM.x+Math.cos(a)*90:P.x,bossM?bossM.y+Math.sin(a)*90:P.y,null);if(blocked(mm.x,mm.y,8)){mm.x=bossM.x;mm.y=bossM.y+50}mm.aggro=true;burst(mm.x,mm.y-10,20,['#ff8a3a','#ffd040'],140,.6)}toast(T('summon'))}

// ================= UPDATE =================
let trackerDirty=true,trackT=0;
function update(dt){
 let ix=0,iy=0;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;if(keys.w||keys.arrowup)iy-=1;if(keys.s||keys.arrowdown)iy+=1;
 if(joyV.x||joyV.y){ix=joyV.x;iy=joyV.y}
 const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
 if(il>.15){P.dx=ix;P.dy=iy;if(P.faceT<=0)P.dir=dirOf(ix,iy)}
 P.faceT-=dt;P.atkCd-=dt;P.swing=Math.max(0,P.swing-dt);P.inv_t=Math.max(0,P.inv_t-dt);P.dashCd-=dt;P.potCd-=dt;P.combatT-=dt;P.whirlT=Math.max(0,P.whirlT-dt);for(let i=0;i<4;i++)P.cds[i]=Math.max(0,P.cds[i]-dt);
 if(P.dashT>0){P.dashT-=dt;moveE(P,P.ddx*420*dt,P.ddy*420*dt,P.r*.8);if(Math.random()<.6)parts.push({x:P.x,y:P.y-14,vx:0,vy:0,life:.25,max:.25,c:'#cfd8ff',s:5,g:0});P.moving=true;P.walk+=dt}
 else if(il>.15){const sp=128*Math.min(1,il);moveE(P,ix*sp*dt,iy*sp*dt,P.r*.8);P.moving=true;P.walk+=dt}else P.moving=false;
 if(keys[' ']||mouseDown||touchAtk)attack();
 ST=stats();P.mp=Math.min(ST.mmp,P.mp+(1.3+P.lvl*.12)*dt);if(P.combatT<=0)P.hp=Math.min(ST.mhp,P.hp+ST.mhp*.012*dt);
 // separation from npcs and monsters
 for(const n of npcs){if(n.kind==='fountain')continue;const d=dist(n,P),md=P.r+11;if(d<md&&d>0){const push=(md-d);moveE(P,(P.x-n.x)/d*push,(P.y-n.y)/d*push,P.r*.8)}}
 for(const m of mons){const d=dist(m,P),md=P.r+m.r*.8;if(d<md&&d>0){const push=(md-d)*.5;if(m.type!=='dragon')moveE(m,(m.x-P.x)/d*push,(m.y-P.y)/d*push,m.r*.7);moveE(P,(P.x-m.x)/d*push,(P.y-m.y)/d*push,P.r*.8)}}
 for(let i=0;i<mons.length;i++)for(let j=i+1;j<mons.length;j++){const a=mons[i],b=mons[j],d=dist(a,b),md=(a.r+b.r)*.7;if(d<md&&d>0){const p=(md-d)*.5;if(a.type!=='dragon')moveE(a,(a.x-b.x)/d*p,(a.y-b.y)/d*p,a.r*.7);if(b.type!=='dragon')moveE(b,(b.x-a.x)/d*p,(b.y-a.y)/d*p,b.r*.7)}}
 // exits
 exitCd-=dt;denyT-=dt;const tx=Math.floor(P.x/TS),ty=Math.floor(P.y/TS);
 if(exitCd<=0)for(const e of CM.exits){if(tx>=e.x&&tx<e.x+e.w&&ty>=e.y&&ty<e.y+e.h){if(e.cond&&!e.cond()){if(denyT<=0){toast(e.deny);denyT=3;SFX.err()}const cx=(e.x+e.w/2)*TS,cy=(e.y+e.h/2)*TS;const a=Math.atan2(P.y-cy,P.x-cx);P.x+=Math.cos(a)*8;P.y+=Math.sin(a)*8;if(e.y===0)P.y=Math.max(P.y,TS*1.6)}else{goExit(e);return}}}
 for(const m of mons)updateMon(m,dt);mons=mons.filter(m=>!m.dead);
 for(const p of projs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.rot+=dt*8;if(p.kind!=='rock'&&Math.random()<.7)parts.push({x:p.x+rnd(-3,3),y:p.y-p.h+rnd(-3,3),vx:rnd(-20,20),vy:rnd(-40,-10),life:.35,max:.35,c:p.from==='p'?pick(['#ffd040','#ff8a2a','#fff0a0']):pick(['#ff6a2a','#ff3a1a','#ffb040']),s:rnd(2,4),g:0});
  if(p.life<=0||solidAt(p.x,p.y)&&gt(CM,Math.floor(p.x/TS),Math.floor(p.y/TS))!==WATER&&gt(CM,Math.floor(p.x/TS),Math.floor(p.y/TS))!==LAVA){explode(p);continue}
  if(p.from==='p'){for(const m of mons){if(Math.hypot(p.x-m.x,p.y-(m.y-m.r*.5))<m.r+p.r+4){if(p.aoe)explode(p);else{hurtMon(m,p.dmg,Math.atan2(p.vy,p.vx),120);p.dead=1}break}}}
  else if(Math.hypot(p.x-P.x,p.y-(P.y-8))<P.r+p.r){hurtPlayer(p.dmg);p.dead=1;burst(p.x,p.y-p.h,8,['#ff8a3a','#ffd040'],90,.4)}}
 projs=projs.filter(p=>!p.dead);
 for(const t of tels){t.t-=dt;if(t.t<=0){t.dead=1;if(t.from==='p'){for(const m of mons)if(Math.hypot(m.x-t.x,m.y-t.y)<t.r+m.r)hurtMon(m,t.dmg,Math.atan2(m.y-t.y,m.x-t.x),260);burst(t.x,t.y-6,46,['#ff8a2a','#ffd040','#ff4a1a','#fff0a0'],260,.9,120,4);flashes.push({x:t.x,y:t.y,r:260,t:.5,max:.5,c:GL_FIRE});shake(.35,9);SFX.boom()}

 if(k==='e'||k==='enter')interact();else if(k>='1'&&k<='4')useSkill(+k-1);else if(k==='r')usePotion();else if(k==='f')useEther();else if(k==='shift')dash();else if(k==='i')openInv();else if(k==='q')openQuests();else if(k==='escape')openInv()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseDown=false});
cv.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;lastMouse=performance.now()});
cv.addEventListener('mousedown',e=>{initAudio();mx=e.clientX;my=e.clientY;lastMouse=performance.now();if(mode!=='play')return;if(e.button===0){mouseDown=true;attack()}else if(e.button===2)useSkill(0)});
addEventListener('mouseup',()=>{mouseDown=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('dText').onclick=()=>dlgAdvance();
document.querySelectorAll('#topBtns button').forEach(b=>b.onclick=()=>{initAudio();const a=b.dataset.a;if(a==='inv'){if(mode==='play')openInv();else if(panelType==='inv')closePanel()}else if(a==='quests'){if(mode==='play')openQuests();else if(panelType==='quests')closePanel()}else if(a==='sound'){muted=!muted;b.textContent=muted?'🔇':'🔊'}else if(a==='save')save(false);else if(a==='lang'&&mode==='play'){mode='lang';showOverlay('lang')}});
// touch joystick
let joyId=null,joyO={x:0,y:0};const jz=$('joyZone'),joy=$('joy'),knob=$('knob');
jz.addEventListener('pointerdown',e=>{initAudio();e.preventDefault();joyId=e.pointerId;jz.setPointerCapture(e.pointerId);joyO={x:e.clientX,y:e.clientY};joy.style.left=e.clientX+'px';joy.style.top=e.clientY+'px';joy.classList.remove('hide');knob.style.transform='translate(0,0)'});
jz.addEventListener('pointermove',e=>{if(e.pointerId!==joyId)return;let dx=e.clientX-joyO.x,dy=e.clientY-joyO.y;const l=Math.hypot(dx,dy),mxl=50;if(l>mxl){dx=dx/l*mxl;dy=dy/l*mxl}knob.style.transform=`translate(${dx}px,${dy}px)`;joyV={x:dx/mxl,y:dy/mxl};if(Math.hypot(joyV.x,joyV.y)<.15)joyV={x:0,y:0}});
const joyEnd=e=>{if(e.pointerId!==joyId)return;joyId=null;joyV={x:0,y:0};joy.classList.add('hide')};jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);
$('tAtk').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();touchAtk=true;attack()});for(const ev of['pointerup','pointercancel','pointerleave'])$('tAtk').addEventListener(ev,()=>{touchAtk=false});
$('tE').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='play')interact()});

applyLang();ST=stats();loadMap('sat',25*TS+16,22*TS+16);mode='title';showOverlay('title');$('banner').classList.remove('show');
requestAnimationFrame(frame);
