<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeuroPlayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Rajdhani:wght@500;600;700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@300..600&family=Nunito:wght@400..800&family=Exo+2:wght@400..700&family=Orbitron:wght@400..700&family=VT323&display=swap" rel="stylesheet">
<style>
/* NeuroPlayer — classic 2000s desktop player look, skinnable.
   Windows: Main · Playlist Editor · Media Library · Neural.
   Sources: Audius + Internet Archive (full tracks), iTunes (30 s previews), Radio Browser (live stations).
   Brain: in-browser MLP 38→16→8→1 trained on likes/skips + live audio features. */
:root{--font:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body[data-skin=classic]{--desk:#1c1c26;--chrome:#38384c;--chrome2:#4a4a62;--hi:#6c6c88;--lo:#16161f;--ctxt:#c8c8d8;--tb:#22222e;--tbline:#b89a3c;--tbtxt:#f0d070;--lcd:#000;--lcdtxt:#00e000;--lcddim:#0b4a0b;--list:#000;--listtxt:#00e000;--listcur:#fff;--listsel:#0b1a8c;--btn:#4a4a62;--btntxt:#dcdcea;--acc:#ffd040;--v1:#00d000;--v2:#e8e800;--v3:#ff2a00}
body[data-skin=amber]{--desk:#140d07;--chrome:#3a2814;--chrome2:#4a341c;--hi:#7a5a32;--lo:#120a03;--ctxt:#f0c88a;--tb:#1c1208;--tbline:#ff9f1a;--tbtxt:#ffbf40;--lcd:#0e0802;--lcdtxt:#ffb000;--lcddim:#4a3002;--list:#0c0702;--listtxt:#e8a020;--listcur:#fff2c8;--listsel:#5a3808;--btn:#4a341c;--btntxt:#ffd9a0;--acc:#ffb000;--v1:#a85a00;--v2:#ffb000;--v3:#fff0b0}
body[data-skin=ice]{--desk:#9fb0c2;--chrome:#c7d2de;--chrome2:#dbe3ec;--hi:#f6f9fc;--lo:#6d7f93;--ctxt:#17263a;--tb:#2f5d8e;--tbline:#8fc0ec;--tbtxt:#fff;--lcd:#061424;--lcdtxt:#6fe3ff;--lcddim:#14384e;--list:#0a1a2c;--listtxt:#9fdcff;--listcur:#fff;--listsel:#1f4f80;--btn:#dbe3ec;--btntxt:#17263a;--acc:#2f7fd0;--v1:#2f7fd0;--v2:#6fe3ff;--v3:#ffffff}
body[data-skin=plum]{--desk:#1b0c18;--chrome:#47203f;--chrome2:#5a2a50;--hi:#8f4f80;--lo:#1a0816;--ctxt:#f7cde6;--tb:#2a0f25;--tbline:#ff6fae;--tbtxt:#ffc2e0;--lcd:#12050d;--lcdtxt:#ff8cc6;--lcddim:#4a1636;--list:#14060f;--listtxt:#f2a5cf;--listcur:#fff;--listsel:#6b2350;--btn:#5a2a50;--btntxt:#ffe0f0;--acc:#ff6fae;--v1:#a8327a;--v2:#ff6fae;--v3:#ffe0f0}
body[data-skin=stealth]{--desk:#060606;--chrome:#151515;--chrome2:#1f1f1f;--hi:#333;--lo:#000;--ctxt:#9a9a9a;--tb:#0c0c0c;--tbline:#3a3a3a;--tbtxt:#ff3b2f;--lcd:#000;--lcdtxt:#ff3b2f;--lcddim:#3a0c08;--list:#040404;--listtxt:#bdbdbd;--listcur:#ff3b2f;--listsel:#262626;--btn:#1f1f1f;--btntxt:#d0d0d0;--acc:#ff3b2f;--v1:#7a1810;--v2:#ff3b2f;--v3:#ffc0b8}
body[data-skin=emerald]{--desk:#07140e;--chrome:#1d3a2c;--chrome2:#2a5240;--hi:#5f9c7f;--lo:#06120c;--ctxt:#cfeee0;--tb:#0e2219;--tbline:#58e0a2;--tbtxt:#9ff5cf;--lcd:#020a06;--lcdtxt:#58f0a8;--lcddim:#0f3a26;--list:#020a06;--listtxt:#7fe8b8;--listcur:#fff;--listsel:#1c5a3e;--btn:#2a5240;--btntxt:#e0fff0;--acc:#58f0a8;--v1:#138a55;--v2:#58f0a8;--v3:#eafff5}
body[data-skin=copper]{--desk:#120c09;--chrome:#5a3a28;--chrome2:#7a5038;--hi:#c08a62;--lo:#1a0e08;--ctxt:#fbe3d0;--tb:#2a1a10;--tbline:#e89a62;--tbtxt:#ffd2ae;--lcd:#03100f;--lcdtxt:#4fe0d0;--lcddim:#0d3a36;--list:#050f0e;--listtxt:#7fe0d4;--listcur:#fff;--listsel:#1d4f4a;--btn:#7a5038;--btntxt:#fff0e2;--acc:#4fe0d0;--v1:#1f9488;--v2:#4fe0d0;--v3:#ffd2ae}
/* modern skins */
body[data-skin=bento]{--desk:#0c0d10;--chrome:#1c1d22;--chrome2:#24262c;--hi:#34363e;--lo:#0a0b0d;--ctxt:#d6d8de;--tb:#1c1d22;--tbline:#ff7a1a;--tbtxt:#f2f3f5;--lcd:#0d0e11;--lcdtxt:#ffa45c;--lcddim:#2c2016;--list:#131418;--listtxt:#c9ccd3;--listcur:#ff7a1a;--listsel:#2b2d35;--btn:#2b2d35;--btntxt:#eef0f3;--acc:#ff7a1a;--v1:#ff4d1a;--v2:#ff9a3c;--v3:#ffe0b0}
body[data-skin=paper]{--desk:#e7e3db;--chrome:#fbfaf7;--chrome2:#ffffff;--hi:#d9d4ca;--lo:#c9c3b7;--ctxt:#262522;--tb:#fbfaf7;--tbline:#d12d2d;--tbtxt:#1c1c1c;--lcd:#f1eee8;--lcdtxt:#1c1c1c;--lcddim:#ddd8ce;--list:#ffffff;--listtxt:#2a2926;--listcur:#d12d2d;--listsel:#f6dedb;--btn:#f1eee8;--btntxt:#1c1c1c;--acc:#d12d2d;--v1:#1c1c1c;--v2:#d12d2d;--v3:#f08a6a}
body[data-skin=glass]{--deskbg:radial-gradient(circle at 15% 20%,#3a6cf0 0,transparent 45%),radial-gradient(circle at 85% 75%,#12b5a0 0,transparent 45%),linear-gradient(135deg,#17153a,#3d1f6e 55%,#0e3b48);--desk:#17153a;--chrome:#1a1d3c;--chrome2:#262a52;--hi:rgba(255,255,255,.28);--lo:rgba(0,0,0,.35);--ctxt:#e8ecff;--tb:#1a1d3c;--tbline:#9ef0ff;--tbtxt:#ffffff;--lcd:#0a0e24;--lcdtxt:#9ef0ff;--lcddim:#1d2a4c;--list:rgba(6,9,26,.55);--listtxt:#d6e4ff;--listcur:#9ef0ff;--listsel:rgba(158,240,255,.22);--btn:rgba(255,255,255,.12);--btntxt:#fff;--acc:#9ef0ff;--v1:#6a7dff;--v2:#9ef0ff;--v3:#ffffff}
body[data-skin=vapor]{--deskbg:linear-gradient(180deg,#1a0838 0,#4a1270 40%,#d53a9d 75%,#ff9e7a 100%);--desk:#2b1055;--chrome:#2a1046;--chrome2:#3a1660;--hi:rgba(255,113,206,.45);--lo:rgba(0,0,0,.4);--ctxt:#ffe6f7;--tb:#2a1046;--tbline:#01cdfe;--tbtxt:#ff71ce;--lcd:#12061f;--lcdtxt:#ff71ce;--lcddim:#3c1450;--list:rgba(18,6,31,.6);--listtxt:#01cdfe;--listcur:#05ffa1;--listsel:rgba(185,103,255,.3);--btn:rgba(255,113,206,.18);--btntxt:#ffe6f7;--acc:#05ffa1;--v1:#b967ff;--v2:#ff71ce;--v3:#01cdfe}
body[data-skin=term]{--desk:#000;--chrome:#000;--chrome2:#000;--hi:#1f8a3a;--lo:#1f8a3a;--ctxt:#33ff66;--tb:#000;--tbline:#33ff66;--tbtxt:#33ff66;--lcd:#000;--lcdtxt:#33ff66;--lcddim:#0b2a12;--list:#000;--listtxt:#33ff66;--listcur:#c8ffd6;--listsel:#0f3d1b;--btn:#000;--btntxt:#33ff66;--acc:#c8ffd6;--v1:#127a2c;--v2:#33ff66;--v3:#c8ffd6;--font:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ctxt);font:13px/1.4 var(--font);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px dotted var(--acc);outline-offset:1px}
.bev{border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi)}
.ins{border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
#desk{position:relative;width:100%;height:100%}
.win{position:absolute;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--chrome2),var(--chrome) 40%);border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 1px #000,0 12px 30px rgba(0,0,0,.45)}
.win.rs{resize:both;overflow:hidden;min-width:320px;min-height:160px}
.win[hidden]{display:none}
.tb{height:20px;flex:none;display:flex;align-items:center;gap:6px;padding:0 3px 0 6px;background:var(--tb);cursor:move;user-select:none;touch-action:none}
.tb .st{flex:1;height:8px;background:repeating-linear-gradient(180deg,var(--tbline) 0 1px,transparent 1px 3px);opacity:.45}
.win.act .tb .st{opacity:1}
.tb b{font:600 10.5px/1 var(--font);letter-spacing:.14em;color:var(--tbtxt);white-space:nowrap}
.tbb{width:14px;height:14px;padding:0;background:var(--btn);color:var(--btntxt);font:bold 10px/10px var(--font)}
.win.shade>:not(.tb){display:none}
.win.shade{resize:none;height:auto!important}
/* main */
.main{display:grid;grid-template-columns:210px minmax(0,1fr);gap:8px;padding:8px}
.lcd{position:relative;height:104px;background:var(--lcd)}
#stIco{position:absolute;left:8px;top:10px;width:14px;height:14px;fill:var(--lcdtxt)}
#time{position:absolute;left:28px;top:-2px;font:300 44px/1 var(--mono);letter-spacing:-.02em;color:var(--lcdtxt);cursor:pointer;text-shadow:0 0 6px color-mix(in srgb,var(--lcdtxt) 40%,transparent)}
#vis{position:absolute;left:6px;right:6px;bottom:5px;height:38px;width:calc(100% - 12px);cursor:pointer}
.info{display:flex;flex-direction:column;gap:6px}
.marq{height:30px;background:var(--lcd);color:var(--lcdtxt);font:var(--marqw) var(--marqsz)/30px var(--mono);white-space:pre;overflow:hidden;padding:0 6px}
.kh{display:flex;gap:10px;align-items:center;font-size:11px;flex-wrap:wrap}
.kh span b{display:inline-block;min-width:30px;background:var(--lcd);color:var(--lcdtxt);font:500 calc(12px*var(--ms)) / 16px var(--mono);padding:1px 4px;margin-right:3px;text-align:right}
.ms{color:var(--lcddim);font-weight:bold;letter-spacing:.04em}.ms.on{color:var(--lcdtxt);text-shadow:0 0 4px var(--lcdtxt)}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;height:10px;background:var(--lcd);border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);width:100%;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:12px;background:var(--btn);border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:10px;background:var(--btn);border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-radius:0;cursor:pointer}
input[type=range]:disabled{opacity:.4}
.tog{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.sb{background:var(--btn);color:var(--btntxt);border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);font:600 10.5px/1 var(--font);letter-spacing:.03em;padding:5px 8px;min-height:20px}
.sb:active,.tbb:active,.tr:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.sb.on{color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
#seek{grid-column:1/-1;height:12px}
.trans{grid-column:1/-1;display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.tr{width:40px;height:30px;display:grid;place-items:center;background:var(--btn);color:var(--btntxt);border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:0}
.tr svg{width:16px;height:16px;fill:currentColor}
.tr.on{color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.trans .gap{flex:1}
/* lists */
.lst{flex:1;overflow:auto;background:var(--list);color:var(--listtxt);font:13px/1.15 var(--font);margin:0 6px;user-select:none}
.row{display:flex;gap:8px;align-items:center;padding:3px 6px;white-space:nowrap;cursor:default}
.row .n{flex:none;opacity:.8}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.row .r{flex:none;font-variant-numeric:tabular-nums}
.row.sel{background:var(--listsel)}
.row.cur{color:var(--listcur)}
.row .mt{flex:none;width:34px;text-align:right;opacity:.85}
.foot{flex:none;display:flex;gap:4px;align-items:center;padding:6px;flex-wrap:wrap}
.foot .sp{flex:1}
.foot .sb{padding:5px 7px}
.foot .lcdm{background:var(--lcd);color:var(--lcdtxt);font:400 calc(13px*var(--ms)) / 20px var(--mono);padding:1px 8px;white-space:nowrap}
/* media library */
.mlb{flex:1;display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px;padding:0 6px;min-height:0}
.tree{background:var(--list);color:var(--listtxt);overflow:auto;font:13px/1.15 var(--font);padding:4px 0}
.tree .h{padding:8px 8px 4px;color:var(--listcur);font-weight:bold;font-size:12px}
.tree .nd{padding:4px 8px 4px 18px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .nd.sel{background:var(--listsel);color:var(--listcur)}
.mlr{display:flex;flex-direction:column;min-height:0;gap:6px}
.mlr .lst{margin:0}
#sf{display:flex;gap:4px;padding:6px 6px 0}
#q{flex:1;height:30px;background:var(--list);color:var(--listtxt);padding:0 10px;font-size:14px}
.srcs{display:flex;gap:10px;flex-wrap:wrap;padding:4px 8px;font-size:11px}
.srcs label{display:flex;gap:4px;align-items:center;cursor:pointer}
.srcs input{accent-color:var(--acc);margin:0}
.hdr{display:flex;gap:8px;padding:3px 6px;background:var(--chrome2);color:var(--ctxt);font-size:11px;font-weight:bold}
.hdr .t{flex:1}
.ico{width:16px;height:16px;flex:none;object-fit:cover;background:var(--lcddim)}
#mlStatus{font-size:11px;padding:0 2px;min-height:14px}
/* neural */
.nnb{padding:6px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.nnc{position:relative;flex:1;min-height:150px;background:var(--lcd)}
#net{position:absolute;inset:0;width:100%;height:100%}
#score{position:absolute;right:8px;top:2px;font:var(--timew) calc(28px*var(--ms)) / 1 var(--mono);color:var(--lcdtxt)}
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:11px}
.feat b{display:block;height:6px;background:var(--lcd);margin-top:3px;overflow:hidden}
.feat b i{display:block;height:100%;width:0;background:var(--lcdtxt)}
#stats{font-size:11px}
/* skin menu */
#skinMenu{position:fixed;z-index:999;display:none;flex-direction:column;min-width:170px;background:var(--chrome);border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 8px 20px rgba(0,0,0,.5);padding:3px}
#skinMenu.show{display:flex}
#skinMenu button{text-align:left;background:none;border:0;padding:7px 10px;color:var(--ctxt)}
#skinMenu button:hover,#skinMenu button.on{background:var(--listsel);color:var(--listcur)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--lcd);color:var(--lcdtxt);font:500 13px/1.3 var(--font);padding:9px 16px;border:1px solid var(--tbline);opacity:0;transition:opacity .25s;pointer-events:none;z-index:1000;max-width:90vw}
#toast.show{opacity:1}
/* narrow screens: stacked windows */
/* ---------- polish ---------- */
.win{background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
  linear-gradient(180deg,color-mix(in srgb,var(--chrome2) 80%,#fff 20%) 0,var(--chrome2) 6px,var(--chrome) 45%,color-mix(in srgb,var(--chrome) 82%,#000) 100%);
  box-shadow:0 0 0 1px #000,inset 0 1px 0 rgba(255,255,255,.12),0 14px 34px rgba(0,0,0,.5)}
.tb{height:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--tb) 75%,#fff 12%),var(--tb) 60%,color-mix(in srgb,var(--tb) 80%,#000));border-bottom:1px solid var(--lo)}
.tb b{text-shadow:0 1px 0 #000}
.win:not(.act) .tb b{opacity:.65}
.tr,.sb,.tbb{background:linear-gradient(180deg,color-mix(in srgb,var(--btn) 70%,#fff 30%),var(--btn) 45%,color-mix(in srgb,var(--btn) 78%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 0 rgba(0,0,0,.4);transition:filter .1s}
.tr:hover,.sb:hover,.tbb:hover{filter:brightness(1.12)}
.tr:active,.sb:active,.tbb:active{background:linear-gradient(180deg,color-mix(in srgb,var(--btn) 78%,#000),var(--btn));box-shadow:inset 0 2px 3px rgba(0,0,0,.45);transform:translateY(1px)}
.tr.on,.sb.on{box-shadow:inset 0 0 0 1px var(--acc),0 0 8px color-mix(in srgb,var(--acc) 45%,transparent)}
.tr svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.lcd,.marq,.lcdm,.kh span b,.nnc,.eqc{background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--lcd) 85%,var(--lcdtxt) 15%),var(--lcd) 70%);box-shadow:inset 0 0 14px rgba(0,0,0,.85)}
#time,#timeGhost{position:absolute;left:30px;top:var(--timetop);font:var(--timew) var(--timesz)/1 var(--mono);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#timeGhost{color:var(--lcddim);opacity:.55;pointer-events:none}
#marq{text-shadow:0 0 6px color-mix(in srgb,var(--lcdtxt) 55%,transparent)}
input[type=range]::-webkit-slider-thumb{background:linear-gradient(180deg,color-mix(in srgb,var(--btn) 60%,#fff),var(--btn));box-shadow:0 1px 2px rgba(0,0,0,.5)}
#seek::-webkit-slider-thumb{width:28px}
#seek::-moz-range-thumb{width:26px}
.row:hover:not(.sel){background:color-mix(in srgb,var(--listsel) 35%,transparent)}
.row.cur .n::before{content:'▶ ';color:var(--acc)}
.tree .nd:hover:not(.sel){background:color-mix(in srgb,var(--listsel) 35%,transparent)}
.star{flex:none;width:16px;text-align:center;cursor:pointer;opacity:.35;color:var(--acc)}
.star.on{opacity:1;text-shadow:0 0 5px var(--acc)}
.star:hover{opacity:1}
*{scrollbar-color:var(--btn) var(--lcd);scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--lcd)}::-webkit-scrollbar-thumb{background:var(--btn);border:1px solid var(--hi)}
/* ---------- equalizer ---------- */
.eqb{padding:8px;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:stretch}
.eqside{display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.eqside select{background:var(--list);color:var(--listtxt);border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);font-size:11px;height:22px;max-width:110px}
.eqs{display:flex;gap:6px;align-items:stretch}
.eqs .col{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}
.eqs input[type=range]{writing-mode:vertical-lr;direction:rtl;width:14px;height:96px}
.eqs .pre{padding-right:8px;margin-right:2px;border-right:1px solid var(--lo)}
.eqc{position:relative;min-height:96px}
#eqCurve{position:absolute;inset:0;width:100%;height:100%}
#eqNote{font-size:10px;grid-column:1/-1;min-height:13px;opacity:.85}
/* ---------- fullscreen visualizer ---------- */
#fsv{position:fixed;inset:0;z-index:2000;background:#000;display:none}
#fsv.show{display:block}
#fsv canvas{position:absolute;inset:0;width:100%;height:100%}
#fsvInfo{position:absolute;left:4vw;bottom:6vh;color:#fff;font:600 clamp(22px,3.2vw,46px)/1.1 var(--font);letter-spacing:-.01em;text-shadow:0 0 12px rgba(0,0,0,.9),0 0 3px #000;transition:opacity 1s;pointer-events:none;max-width:85vw}
#fsvInfo small{display:block;font-size:.55em;opacity:.8}
#fsvBar{position:absolute;top:14px;right:14px;display:flex;gap:6px;transition:opacity .4s}
#fsv.idle #fsvBar{opacity:0}#fsv.idle{cursor:none}
#fsvMode{position:absolute;top:18px;left:18px;color:#fff;font:400 calc(13px*var(--ms)) var(--mono);opacity:.75;transition:opacity .4s}
#fsv.idle #fsvMode{opacity:0}
/* ---------- modern skin shapes ---------- */
body{background:var(--deskbg,var(--desk));background-attachment:fixed}
body:is([data-style=flat],[data-style=glass]) .win{border-radius:14px;border:1px solid var(--hi);background:var(--chrome);box-shadow:0 20px 44px rgba(0,0,0,.45);overflow:hidden}

body[data-skin=paper] #time,body[data-skin=paper] #marq{text-shadow:none}
body[data-style=term] *{font-family:var(--mono)!important}
body[data-style=term] .win{background:#000;border:1px solid var(--hi);box-shadow:0 0 0 1px #000,0 0 18px rgba(51,255,102,.15)}
body[data-style=term] .tb{background:#000;border-bottom:1px dashed var(--hi)}
body[data-style=term] .tb .st{background:none;border-top:1px dashed var(--hi);height:1px}
body[data-style=term] .tb b::before{content:'> '}
body[data-style=term] :is(.tr,.sb,.tbb){background:#000;border:1px solid var(--hi);box-shadow:none}
body[data-style=term] :is(.tr,.sb):hover{background:var(--listsel)}
body[data-style=term] :is(.lcd,.marq,.lcdm,.kh span b,.nnc,.eqc,.lst,.tree){background:#000;box-shadow:none;border:1px solid var(--hi)}
body[data-style=term] #timeGhost{display:none}
#skinMenu .grp{padding:6px 10px 2px;font-size:10px;font-weight:bold;letter-spacing:.1em;opacity:.6}
#skinMenu .sw{display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:-1px;border:1px solid rgba(0,0,0,.4)}
/* ---------- font sets (SKIN menu → FONT) ---------- */
body{--timesz:60px;--timew:500;--timetop:0px;--marqsz:20px;--marqw:600;--ms:1.2}
body[data-font=modern]{--font:Manrope,"Segoe UI",system-ui,sans-serif;--mono:Rajdhani,"Segoe UI",sans-serif;--timesz:60px;--timew:500;--timetop:0px;--marqsz:20px;--marqw:600;--ms:1.2}
body[data-font=clean]{--font:Inter,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,monospace;--timesz:50px;--timew:300;--timetop:6px;--marqsz:15px;--marqw:400;--ms:1}
body[data-font=rounded]{--font:Nunito,"Segoe UI",system-ui,sans-serif;--mono:Nunito,"Segoe UI",sans-serif;--timesz:52px;--timew:700;--timetop:2px;--marqsz:17px;--marqw:700;--ms:1.08}
body[data-font=tech]{--font:"Exo 2","Segoe UI",system-ui,sans-serif;--mono:Orbitron,"Segoe UI",sans-serif;--timesz:40px;--timew:500;--timetop:12px;--marqsz:14px;--marqw:500;--ms:.88}
body[data-font=system]{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;--timesz:48px;--timew:300;--timetop:6px;--marqsz:15px;--marqw:400;--ms:1}
body[data-font=retro]{--font:Tahoma,Verdana,"Segoe UI",sans-serif;--mono:VT323,monospace;--timesz:58px;--timew:400;--timetop:-2px;--marqsz:24px;--marqw:400;--ms:1.45}
#skinMenu .fnt{font-size:14px}
/* ---------- profiles ---------- */
#profBtn{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:16px;padding:0 8px;font-size:10px;line-height:14px;flex:none}
body:is([data-style=flat],[data-style=glass]) #profBtn{height:20px;line-height:20px;border-radius:10px}
body:not([data-font=clean]):not([data-font=system]):not([data-font=retro]) #timeGhost{display:none}
#profMenu{position:fixed;z-index:999;display:none;flex-direction:column;min-width:250px;max-width:330px;background:var(--chrome);border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 8px 20px rgba(0,0,0,.5);padding:3px}
#profMenu.show{display:flex}
#profMenu button{text-align:left;background:none;border:0;padding:8px 10px;color:var(--ctxt);display:block;width:100%}
#profMenu button small{display:block;opacity:.65;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#profMenu button:hover,#profMenu button.on{background:var(--listsel);color:var(--listcur)}
#profMenu hr{border:0;border-top:1px solid var(--lo);margin:3px 0}
#profDlg{position:fixed!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:min(440px,94vw)!important;height:auto!important;z-index:1500;resize:none}
#profDlg .tb{cursor:default}
.pdb{padding:14px;display:grid;gap:10px}
.pdb label{display:grid;gap:4px;font-size:12px}
.pdb label small{opacity:.6}
.pdb input:not([type=checkbox]),.pdb select{height:32px;background:var(--list);color:var(--listtxt);border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:0 9px;font-size:14px;font-family:var(--font)}
.pd2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pdhint{font-size:11.5px;min-height:15px;opacity:.85}.pdhint b{color:var(--acc)}
.pdb fieldset{border:1px solid var(--lo);padding:8px 10px 10px;display:grid;gap:8px;margin:0}
.pdb legend{padding:0 4px}
.ck{display:flex!important;align-items:center;gap:6px;font-size:12.5px!important}
.ck input{accent-color:var(--acc)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{min-width:38px}
.pdf{display:flex;gap:6px;align-items:center}.pdf .sp{flex:1}
body:is([data-style=flat],[data-style=glass]) .pdb :is(input:not([type=checkbox]),select){border:0;border-radius:8px}
body:is([data-style=flat],[data-style=glass]) #profMenu{border-radius:10px}
#dlgShade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1400;display:none}#dlgShade.show{display:block}
/* ---------- visualizer settings ---------- */
#visCfgBtn{position:absolute;right:4px;top:4px;width:20px;height:20px;padding:0;border:0;background:transparent;color:var(--lcdtxt);opacity:.35;font-size:13px;line-height:20px;cursor:pointer}
#visCfgBtn:hover,.lcd:hover #visCfgBtn{opacity:.9}
#visMenu{position:fixed;z-index:999;display:none;flex-direction:column;gap:9px;width:270px;padding:10px 12px 12px;background:var(--chrome);color:var(--ctxt);border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 10px 26px rgba(0,0,0,.55)}
#visMenu.show{display:flex}
#visMenu .grp{font-size:10px;font-weight:bold;letter-spacing:.1em;opacity:.6}
#visMenu label{display:grid;gap:3px;font-size:11.5px}
#visMenu label b{position:absolute;right:12px;font-weight:600;color:var(--acc)}
#visMenu label:not(.ck){position:relative}
#visMenu label:not(.ck) b{position:absolute;right:0;top:0}
#visMenu select{height:28px;background:var(--list);color:var(--listtxt);border:1px solid var(--lo);font-size:12.5px;font-family:var(--font)}
.vc2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
body:is([data-style=flat],[data-style=glass]) #visMenu{border-radius:12px}
body:is([data-style=flat],[data-style=glass]) #visMenu select{border:0;border-radius:7px}
/* ---------- Tabs layout ---------- */
body[data-layout=tabs] #desk{display:flex;gap:10px;padding:10px;height:100%}
body[data-layout=tabs] #colL{width:560px;flex:none;display:flex;flex-direction:column;gap:10px;min-height:0}
body[data-layout=tabs] #colR{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
body[data-layout=tabs] #desk .win{position:static!important;width:auto!important;height:auto!important;resize:none!important;box-shadow:0 0 0 1px #000,0 8px 22px rgba(0,0,0,.35)}
body[data-layout=tabs] #colL #w-pl{flex:1;min-height:0}
body[data-layout=tabs] #colR .win{flex:1;min-height:0}
body[data-layout=tabs] #colR .win>.tb{display:none}
body[data-layout=tabs] #colR #w-ml>#sf{padding-top:8px}
body[data-layout=tabs] #colR .win>.foot{padding-bottom:8px}
body[data-layout=tabs] .tb{cursor:default}
body[data-layout=tabs] [data-close],body[data-layout=tabs] .tog [data-show]{display:none}
body[data-layout=tabs] #w-eq .eqs input[type=range]{height:220px}
body[data-layout=tabs] #w-eq .eqb{align-content:start;padding:16px}
body[data-layout=tabs] #w-eq .eqc{min-height:220px}
body[data-layout=tabs] #w-dj .djb{padding:12px 14px;gap:9px}
body[data-layout=tabs] #w-dj .pads .chip{padding:6px 14px;font-size:12.5px}
#tabbar{display:flex;gap:3px;flex:none;overflow-x:auto;scrollbar-width:none;padding-left:2px}
#tabbar::-webkit-scrollbar{display:none}
#tabbar button{flex:none;background:linear-gradient(180deg,var(--chrome2),var(--chrome));color:var(--ctxt);border:1px solid;border-color:var(--hi) var(--lo) transparent var(--hi);border-bottom:0;padding:9px 18px 8px;font:600 12px/1 var(--font);letter-spacing:.04em;opacity:.7;cursor:pointer;margin-bottom:-1px}
#tabbar button:hover{opacity:1}
#tabbar button.on{opacity:1;color:var(--acc);box-shadow:inset 0 2px 0 var(--acc);position:relative;z-index:2}
body:is([data-style=flat],[data-style=glass]) #tabbar button{border:0;border-radius:10px 10px 0 0;background:color-mix(in srgb,var(--chrome) 70%,transparent)}
body:is([data-style=flat],[data-style=glass]) #tabbar button.on{background:var(--chrome);box-shadow:inset 0 2px 0 var(--acc)}
body[data-style=glass] #tabbar button.on{background:color-mix(in srgb,var(--chrome) 58%,transparent);backdrop-filter:blur(20px)}
body:is([data-style=flat],[data-style=glass])[data-layout=tabs] #colR .win{border-top-left-radius:0}
body[data-style=term] #tabbar button{background:#000;border:1px solid var(--hi);border-bottom:0}
@media(max-width:999px){
  body[data-layout=tabs]{overflow:auto}
  body[data-layout=tabs] #desk{flex-direction:column;height:auto}
  body[data-layout=tabs] #colL{width:auto}
  body[data-layout=tabs] #colR .win{min-height:72vh;height:auto!important}
  body[data-layout=tabs] #w-eq .eqs input[type=range]{height:140px}
}
/* ---------- version tag ---------- */
.tb .ver{opacity:.55;font-weight:500;letter-spacing:.06em}
/* ---------- AI DJ ---------- */
.djb{flex:1;overflow:auto;padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:0}
.djl{font-size:11px;font-weight:600;letter-spacing:.04em;opacity:.8;margin-top:2px}
.pads{display:flex;flex-wrap:wrap;gap:5px}
.pads .chip{padding:4px 11px}
.djr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.djr input[type=range]{flex:1;min-width:120px}
#djEv{font:500 calc(14px*var(--ms)) var(--mono);color:var(--acc);min-width:40px;text-align:right}
.seg{display:flex;gap:0}.seg .sb{border-radius:0}
body:is([data-style=flat],[data-style=glass]) .seg .sb:first-child{border-radius:8px 0 0 8px}body:is([data-style=flat],[data-style=glass]) .seg .sb:last-child{border-radius:0 8px 8px 0}
.djr .sp{flex:1}
.djgo{padding:6px 12px!important;font-size:11.5px!important}
.djgo.on{background:var(--acc)!important;color:var(--chrome)!important}
#djStatus{font-size:11.5px;min-height:16px;opacity:.9}#djStatus b{color:var(--acc);font-weight:600}
/* ---------- station finder ---------- */
.chips{display:flex;gap:5px;padding:2px 6px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--list);color:var(--listtxt);border:1px solid var(--lo);border-radius:999px;padding:3px 10px;font:500 11.5px/1.3 var(--font);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--listcur)}
.chip.on{background:var(--listsel);color:var(--listcur);border-color:var(--acc)}
body[data-style=term] .chip{border-radius:0}
#mlStatus b{color:var(--acc);font-weight:600}
@media(max-width:999px){
  body{overflow:auto}
  #desk{height:auto;display:flex;flex-direction:column;gap:10px;padding:10px}
  .win{position:static!important;width:auto!important;resize:none!important}
  .win.rs{height:420px!important}
  #w-nn{height:300px!important}
  .tb{cursor:default}
}
@media(max-width:560px){
  .main{grid-template-columns:1fr}
  .mlb{grid-template-columns:1fr;grid-template-rows:120px minmax(0,1fr)}
  .win.rs#w-ml{height:560px!important}
  .tr{width:36px;height:34px}
}
</style>
</head>

/* ================= Neural network ================= */
class MLP{
  constructor(sizes,data){
    this.s=sizes;
    if(data&&data.W&&data.W[0]&&data.W[0][0]&&data.W[0][0].length===sizes[0]){this.W=data.W;this.b=data.b;return}
    this.W=[];this.b=[];
    for(let l=0;l<sizes.length-1;l++){
      const n=sizes[l],m=sizes[l+1],sc=Math.sqrt(2/(n+m)),last=l===sizes.length-2;
      this.W.push(Array.from({length:m},()=>Array.from({length:n},()=>last?0:(Math.random()*2-1)*sc)));
      this.b.push(new Array(m).fill(0));
    }
  }
  forward(x){
    const acts=[x];let a=x;
    for(let l=0;l<this.W.length;l++){
      const last=l===this.W.length-1,W=this.W[l],B=this.b[l],out=new Array(W.length);
      for(let j=0;j<W.length;j++){let z=B[j];const r=W[j];for(let i=0;i<r.length;i++)z+=r[i]*a[i];out[j]=last?1/(1+Math.exp(-z)):Math.tanh(z)}
      a=out;acts.push(a);
    }
    return acts;
  }
  train(samples,epochs=80,lr=0.03,l2=1e-4){
    let loss=0;
    for(let e=0;e<epochs;e++){
      loss=0;const idx=samples.map((_,i)=>i).sort(()=>Math.random()-.5);
      for(const k of idx){
        const {x,y,w}=samples[k],acts=this.forward(x),p=acts.at(-1)[0];
        loss+=-w*(y*Math.log(p+1e-9)+(1-y)*Math.log(1-p+1e-9));
        let delta=[(p-y)*w];
        for(let l=this.W.length-1;l>=0;l--){
          const a=acts[l],W=this.W[l],nd=l>0?new Array(a.length).fill(0):null;
          for(let j=0;j<W.length;j++){
            const d=delta[j],r=W[j];
            for(let i=0;i<r.length;i++){if(nd)nd[i]+=r[i]*d;r[i]-=lr*(d*a[i]+l2*r[i])}
            this.b[l][j]-=lr*d;
          }
          if(nd)delta=nd.map((v,i)=>v*(1-a[i]*a[i]));
        }
      }
    }
    return loss/Math.max(1,samples.length);
  }
}
const SIZES=[38,16,8,1];
/* listening profiles: each has its own taste network, genres, EQ and optional skin + schedule */
let profiles=store.get('np2_profiles',null);
if(!Array.isArray(profiles)||!profiles.length){

            {id:'work',name:'Work',genres:'lofi, ambient, chill jazz, classical music',eq:'Soft',skin:'',sched:{on:false,days:[1,2,3,4,5],from:'09:00',to:'17:00'}}];

const oneHot=(v,h,n)=>{for(let i=0;i<n;i++)v.push(i===h%n?1:0)};

computeMean();
function audioVec(a){
  if(!a||a.n<30)return null;
  const n=a.n,bs=a.b.reduce((x,y)=>x+y,0)||1;
  return [clamp(a.c/n*5),clamp(a.r/n*2.5),clamp(a.f/n*2),clamp(a.rms/n*3),...a.b.map(v=>Math.sqrt(v/bs)),clamp(a.on/Math.max(1,a.time)/8),1];
}

  v.push(clamp(Math.log1p(t.duration||0)/Math.log1p(900)));

  v.push(...(fps[t.id]||(cur&&t.id===cur.id?audioVec(acc):null)||meanFp||new Array(12).fill(0)));
  return v;
}
const trained=()=>samples.length>=3;

/* ================= Audio engine ================= */
const aA=$('#aA'),aB=$('#aB');
let ctx=null,analyser,panner,freq,tbuf,prevMag,mags,player=null,useWA=false,tok=0,fails=0,acc=null,live=[0,0,0,0];
const newAcc=()=>({n:0,c:0,r:0,f:0,rms:0,b:[0,0,0,0,0,0],on:0,time:0,fm:0,last:0});
function ensureCtx(){
  if(ctx)return;
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaElementSource(aA);analyser=ctx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=(visCfg?.smooth??55)/100;
    panner=ctx.createStereoPanner?ctx.createStereoPanner():null;
    preNode=ctx.createGain();
    eqNodes=EQF.map((f,i)=>{const b=ctx.createBiquadFilter();b.type=i===0?'lowshelf':i===EQF.length-1?'highshelf':'peaking';b.frequency.value=f;b.Q.value=1.4;return b});
    let last=src;for(const n of [preNode,...eqNodes]){last.connect(n);last=n}
    if(panner){last.connect(panner);panner.connect(analyser);panner.pan.value=+$('#bal').value}else last.connect(analyser);
    applyEq();
    analyser.connect(ctx.destination);
    freq=new Float32Array(analyser.frequencyBinCount);tbuf=new Float32Array(analyser.fftSize);prevMag=new Float32Array(freq.length);mags=new Float32Array(freq.length);
  }catch(e){ctx=null}
}
const EDGES=[0,150,400,1000,2500,6000,1e9];
function analyse(dt){
  analyser.getFloatFrequencyData(freq);analyser.getFloatTimeDomainData(tbuf);
  acc.time+=dt;
  let rms=0;for(let i=0;i<tbuf.length;i++)rms+=tbuf[i]*tbuf[i];rms=Math.sqrt(rms/tbuf.length);
  if(rms<.003)return;
  const N=freq.length,hz=ctx.sampleRate/2/N,b=[0,0,0,0,0,0];let tot=0,tot2=0,cen=0,logs=0,flux=0;
  for(let i=0;i<N;i++){
    const m=isFinite(freq[i])?Math.pow(10,freq[i]/20):0;mags[i]=m;tot+=m;tot2+=m*m;cen+=i*m;logs+=Math.log(m+1e-9);
    const d=m-prevMag[i];if(d>0)flux+=d;prevMag[i]=m;
    const f=i*hz;let k=0;while(f>=EDGES[k+1])k++;b[k]+=m*m;
  }
  if(tot<=0)return;
  let cum=0,ro=0;for(let i=0;i<N;i++){cum+=mags[i];if(cum>=.85*tot){ro=i;break}}
  const c=cen/tot/N;

  const tq=it.matched?[it.labels[0]||'',...it.rest].join(' ').trim()||q:q;

    const loose=scored.filter(x=>x[1]<2).sort((a,b)=>b[1]-a[1]||a[2]-b[2]).map(x=>x[0]);
    const fullHits=exact.filter(t=>!t.live&&t.src!=='itunes'&&relevance(t,q)>=4).length;

    const seen=new Set();out=[...top,...similar,...loose].filter(t=>!seen.has(t.id)&&seen.add(t.id));
    const nEx=exact.length+previews.length;
    if(!fullHits&&artistHits.length){

        (previews.length?` Showing <b>${previews.length}</b> 30-second previews from iTunes`:'')+
        (similar.length?` and <b>${similar.length}</b> ${esc(gname)} stations that play this style`:'')+'. Other loose matches are listed below.';
    }else note=nEx?`<b>${nEx}</b> exact matches for “${esc(q)}” first, then loose matches.`:`No exact matches for “${esc(q)}” — these are loose matches.`;
  }

const FSV_MODES=['Thin bars','Mirror bars','Spectrum line','Tunnel','Ring','Starfield','Ribbons'];

function drawFsv(tm){
  const r=fsvC.getBoundingClientRect(),dpr=Math.min(1.5,devicePixelRatio||1),w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);
  if(fsvC.width!==w||fsvC.height!==h){fsvC.width=fsvB.width=w;fsvC.height=fsvB.height=h}
  if(performance.now()-fsvIdle>2500)$('#fsv').classList.add('idle');
  const g=fsvC.getContext('2d'),mode=FSV_MODES[fsvMode],cx=w/2,cy=h/2,hue=(tm/60)%360;
  const B=bandsOf(96,tm),bass=(B[0]+B[1]+B[2]+B[3])/4,mid=B.slice(20,50).reduce((a,b)=>a+b,0)/30,treb=B.slice(60).reduce((a,b)=>a+b,0)/36;
  const ft=fsvTheme,grad=()=>tgrad(g,ft,0,h,0,0,tm);
  if(mode==='Thin bars'||mode==='Mirror bars'||mode==='Spectrum line'){
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,w,h);
    const n=mode==='Spectrum line'?96:mode==='Mirror bars'?72:96,bw=w/n,q=grad();
    if(mode==='Spectrum line'){
      g.strokeStyle=q;g.lineWidth=3*dpr;g.shadowColor=tcol(ft,.6,1,tm);g.shadowBlur=16;g.beginPath();
      for(let i=0;i<n;i++){const x=(i+.5)*bw,y=h*.85-B[i]*h*.65;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();g.shadowBlur=0;
      g.lineTo(w,h);g.lineTo(0,h);g.closePath();g.globalAlpha=.15;g.fillStyle=q;g.fill();g.globalAlpha=1;
      g.strokeStyle=tcol(ft,1,1,tm,.4);g.globalAlpha=.35;g.lineWidth=1.5*dpr;g.beginPath();
      for(let i=0;i<200;i++){const x=i/199*w,y=h*.85+waveAt(i,200,tm)*h*.1;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();g.globalAlpha=1;
      return;
    }
    for(let i=0;i<n;i++){
      const v=B[i],x=i*bw+bw*.2,bwi=Math.max(1,bw*.6);
      if(mode==='Mirror bars'){const hh=v*h*.42;g.fillStyle=q;g.fillRect(x,cy-hh,bwi,hh*2);g.globalAlpha=.25;g.fillRect(x,cy+hh+4*dpr,bwi,hh*.35);g.globalAlpha=1}
      else{const hh=v*h*.75;g.fillStyle=q;g.fillRect(x,h-hh,bwi,hh)}
    }
    return;
  }
  if(mode==='Tunnel'||mode==='Ribbons'){
    const b=fsvB.getContext('2d');b.clearRect(0,0,w,h);b.drawImage(fsvC,0,0);
    g.fillStyle='#000';g.fillRect(0,0,w,h);
    g.save();g.translate(cx,cy);
    if(mode==='Tunnel'){g.rotate(.004+bass*.02);const sc=1.018+bass*.05;g.scale(sc,sc)}else{g.translate(0,-2*dpr);g.scale(1.004,1.004)}
    g.translate(-cx,-cy);g.globalAlpha=mode==='Tunnel'?.93:.9;g.drawImage(fsvB,0,0);g.restore();g.globalAlpha=1;
    g.globalCompositeOperation='lighter';
    if(mode==='Tunnel'){
      const R=Math.min(w,h)*(.12+bass*.12);g.lineWidth=2.5*dpr;g.strokeStyle=tcol(ft,tri(tm/3000),1,tm,treb*.6);g.beginPath();
      for(let i=0;i<=128;i++){const a=i/128*Math.PI*2,v=waveAt(i%128,128,tm),rr=R*(1+v*1.4);const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?g.lineTo(x,y):g.moveTo(x,y)}
      g.stroke();
    }else{
      for(let k=0;k<3;k++){g.strokeStyle=tcol(ft,tri(k*.45+tm/4000),.75,tm+k*1500);g.lineWidth=(2+k)*dpr;g.beginPath();
        for(let i=0;i<160;i++){const x=i/159*w,y=cy+(k-1)*h*.12+waveAt((i+k*13)%160,160,tm)*h*(.35+mid*.4)+Math.sin(tm/700+i/20+k)*h*.04;i?g.lineTo(x,y):g.moveTo(x,y)}
        g.stroke()}
    }
    g.globalCompositeOperation='source-over';return;
  }
  if(mode==='Ring'){
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,0,w,h);
    const n=96,R=Math.min(w,h)*(.2+bass*.06);
    for(let i=0;i<n;i++){
      const v=B[i],a=i/n*Math.PI*2-Math.PI/2,len=v*Math.min(w,h)*.28;
      g.strokeStyle=tcol(ft,tri(i/n*2+tm/6000),1,tm+i*40,v*.5);g.lineWidth=Math.max(1.5,Math.PI*2*R/n*.5);
      g.beginPath();g.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);g.lineTo(cx+Math.cos(a)*(R+len),cy+Math.sin(a)*(R+len));g.stroke();
      g.beginPath();g.moveTo(cx+Math.cos(a)*R*.96,cy+Math.sin(a)*R*.96);g.lineTo(cx+Math.cos(a)*(R*.96-len*.25),cy+Math.sin(a)*(R*.96-len*.25));g.stroke();
    }
    g.beginPath();g.arc(cx,cy,R*.8*(1+bass*.15),0,7);g.fillStyle=tcol(ft,.5,.03+bass*.1,tm);g.fill();
    return;
  }
  /* Starfield */
  g.fillStyle='rgba(0,0,0,.3)';g.fillRect(0,0,w,h);
  while(stars.length<420)stars.push({x:(Math.random()-.5)*w,y:(Math.random()-.5)*h,z:Math.random()*w});
  const sp=(4+bass*60+mid*20)*dpr;
  for(const st of stars){
    const pz=st.z;st.z-=sp;if(st.z<1){st.x=(Math.random()-.5)*w;st.y=(Math.random()-.5)*h;st.z=w;continue}
    const k=w*.5/st.z,pk=w*.5/pz,x=cx+st.x*k,y=cy+st.y*k,px=cx+st.x*pk,py=cy+st.y*pk;
    g.strokeStyle=tcol(ft,1-st.z/w,1-st.z/w,tm+st.z*2,treb*.5);g.lineWidth=Math.max(1,(1-st.z/w)*3*dpr);
    g.beginPath();g.moveTo(px,py);g.lineTo(x,y);g.stroke();
  }
}

  'Lo-fi':['lofi|lo-fi','Lo-Fi'],Jazz:['jazz|smooth jazz','Jazz'],Rock:['rock|classic rock','Rock'],Metal:['metal|heavy metal','Metal'],Pop:['pop|hits','Pop'],'Hip-hop':['hip hop|rap','Hip-Hop/Rap'],
  Classical:['classical','Classical'],Ambient:['ambient','Ambient'],Synthwave:['synthwave|retrowave','Electronic'],Latin:['latin|reggaeton','Latin'],Reggae:['reggae','Reggae'],
  'R&B / Soul':['rnb|soul','R&B/Soul'],Folclor:['folclor|populara|folk','Folk'],Manele:['manele',''],'80s':['80s',''],'90s':['90s','']};

function djTags(){

  for(const k of dj.styles)if(STYLES[k])add(STYLES[k][0]);

async function djRefill(){
  if(djBusy)return;djBusy=true;
  const tags=djTags(),jobs=[];
  try{
    if(dj.src!=='tracks')jobs.push(findStations('',{tags:tags.slice(0,6),labels:[],cc:null,rest:[]}).catch(()=>[]));
    if(dj.src!=='radio'){
      const g=dj.styles.map(k=>STYLES[k][1]).filter(Boolean);
      for(const x of g.slice(0,3))jobs.push(trendingAudius(x).catch(()=>[]));
      const words=[...dj.styles.filter(k=>!STYLES[k][1]),...dj.moods].slice(0,3);
      for(const w of words)jobs.push(searchAudius(w).catch(()=>[]));
      if(!g.length&&!words.length)jobs.push(searchAudius(tags[0]).catch(()=>[]));
    }
    const got=(await Promise.all(jobs)).flat(),have=new Set(djPool.map(t=>t.id));

/* how the DJ scores a candidate: mood/style match + your learned taste + measured energy */
function djScore(t){
  const tags=djTags(),hay=t.live?(t.tags||''):(','+(t.genre||'')+','+(t.title||'')+',').toLowerCase();
  let hits=0;for(const tg of tags)if(hay.includes(tg))hits++;
  const sty=dj.styles.map(k=>STYLES[k][1].toLowerCase()).filter(Boolean);
  if(!t.live&&sty.some(g=>(t.genre||'').toLowerCase()===g))hits+=2;
  const match=Math.min(1,.35+hits*.25);
  const taste=trained()?score(t):.5;
  const f=fps[t.id];let efit=.5,eMeas=null;
  if(f){eMeas=clamp(f[3]*.45+f[10]*.4+f[0]*.15);efit=clamp(1-Math.abs(eMeas-dj.energy/100)*1.6)}
  return {total:.42*match+.38*taste+.2*efit,match,taste,efit,eMeas};
}
async function djPick(){
  const seen=new Set([...recent.slice(0,40),cur?.id]);
  let pool=djPool.filter(t=>!seen.has(t.id)&&(dj.src==='both'||(dj.src==='radio')===!!t.live));
  if(pool.length<6){djStatus('Looking for <b>'+esc(djDesc())+'</b>…');await djRefill();pool=djPool.filter(t=>!seen.has(t.id)&&(dj.src==='both'||(dj.src==='radio')===!!t.live))}
  if(!pool.length){djStatus("Couldn't find anything for this mood right now — try another style or source.");return null}
  const sc=pool.map(djScore),mx=Math.max(...sc.map(x=>x.total)),ex=sc.map(x=>Math.exp((x.total-mx)/.06)),sum=ex.reduce((a,b)=>a+b,0);
  let r=Math.random()*sum,i=0;for(;i<pool.length-1;i++){r-=ex[i];if(r<=0)break}
  const t=pool[i],x=sc[i],why=[`mood/style ${Math.round(x.match*100)}%`,trained()?`your taste ${Math.round(x.taste*100)}%`:'taste: still learning',x.eMeas!=null?`energy ${Math.round(x.eMeas*100)}% (wanted ${dj.energy}%)`:'energy: not measured yet'];
  djStatus(`AI DJ picked <b>${esc(t.title)}</b>${t.artist?' — '+esc(t.artist):''} · ${why.join(' · ')}`);
  return t;
}
async function djStart(){
  if(dj.on){dj.on=false;radioOn=false;$('#bAI').classList.remove('on');renderDj();djStatus('AI DJ stopped.');return}

$('#pdDays').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const d=+b.dataset.d;pdDays=pdDays.includes(d)?pdDays.filter(x=>x!==d):[...pdDays,d];renderDays()};
function pdHint(){const v=$('#pdGenres').value.trim();if(!v){$('#pdHint').textContent='Empty = the network learns freely from everything you play.';return}const it=parseIntent(v);$('#pdHint').innerHTML=it.matched||it.rest.length?'Understood: '+intentLabel(it):'—'}
$('#pdGenres').oninput=pdHint;
$('#pdX').onclick=$('#pdCancel').onclick=closeProfDlg;$('#dlgShade').onclick=closeProfDlg;
$('#pdForm').onsubmit=e=>{
  e.preventDefault();const name=$('#pdName').value.trim().slice(0,24);if(!name)return;
  const data={name,genres:$('#pdGenres').value.trim().slice(0,200),eq:$('#pdEq').value,skin:$('#pdSkin').value,sched:{on:$('#pdAuto').checked,days:pdDays.sort(),from:$('#pdFrom').value||'00:00',to:$('#pdTo').value||'23:59'}};
  if(data.sched.on&&!data.sched.days.length)return toast('Pick at least one day for the schedule');
  if(editing){Object.assign(profiles.find(p=>p.id===editing),data);saveProfiles();closeProfDlg();
    const P=curProf();if(editing===prof){if(P.eq&&PRESETS[P.eq]){eq.g=[...PRESETS[P.eq]];eq.preset=P.eq;buildEq();applyEq()}if(P.skin)applySkin(P.skin);updateProfBtn();renderChips();drawStats();radioPool=[]}
    toast('Profile saved')}
  else{const id='p'+Date.now().toString(36);profiles.push({id,...data});saveProfiles();closeProfDlg();switchProfile(id,'new — it starts with a fresh network')}
  lastAuto=null;checkSchedule();
};
$('#pdDel').onclick=()=>{
  if(!editing||profiles.length<2)return;const P=profiles.find(p=>p.id===editing);
  if(!confirm(`Delete profile “${P.name}” and what it learned?`))return;
  profiles=profiles.filter(p=>p.id!==editing);saveProfiles();['np2_net_','np2_samples_','np2_loss_'].forEach(k=>store.set(k+editing,null));
  closeProfDlg();if(prof===editing){prof='';switchProfile(profiles[0].id)}
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#profDlg').hidden)closeProfDlg()});
/* automatic switching by day + time; a manual pick holds until the schedule's answer changes */
let lastAuto=null,autoHold=false;
const toMin=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
function checkSchedule(){
  const auto=profiles.filter(P=>P.sched?.on);if(!auto.length)return;
  const now=new Date(),d=now.getDay(),m=now.getHours()*60+now.getMinutes();
  const hit=auto.find(P=>{const a=toMin(P.sched.from),b=toMin(P.sched.to);return P.sched.days.includes(d)&&(a<=b?m>=a&&m<b:m>=a||m<b)});
  const target=hit?hit.id:(profiles.find(P=>!P.sched?.on)||profiles[0]).id;
  if(target===lastAuto)return;
  lastAuto=target;if(autoHold){autoHold=false}
  if(target!==prof)switchProfile(target,hit?'auto, '+schedTxt(hit).replace('auto ',''):'auto');
}
setInterval(checkSchedule,30000);

/* ================= Boot ================= */
document.body.dataset.font=font;applySkin(skin);updateProfBtn();setState('stop');buildShell();layout();renderTree();renderPl();renderMl();drawStats();updateNP();front(W('main'));
requestAnimationFrame(frame);
setMl('Loading trending tracks…');
checkSchedule();
trendingAudius().then(L=>{lib.trending=L;renderTree();if(node==='trending'){renderMl();setMl('Trending on Audius this week — full tracks')}})
  .catch(()=>{if(node==='trending')setMl("Couldn't reach Audius — try Search or a radio category")});
}
</script>
